<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投資績效追蹤系統 (華麗旗艦版)</title>
  
  <!-- 1. 載入 React 核心 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- 2. 載入 PropTypes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  
  <!-- 3. 載入 Recharts 圖表庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/1.8.5/Recharts.min.js"></script>

  <!-- 4. 載入 Babel 編譯 JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

  <!-- 5. 載入 html2canvas 用於截圖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 6. 載入 JSZip 用於全體客戶報表一鍵壓縮打包下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { 
      margin: 0; 
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: radial-gradient(circle at top right, #fdfbfb 0%, #ebedee 100%);
      color: #334155;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box;}
    input[type="month"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.04), 0 5px 15px rgba(0,0,0,0.02);
      border-radius: 20px;
    }

    /* 截圖導出時的特別樣式：強制隱藏編輯輔助虛線與高亮外框 */
    .html2canvas-container [contenteditable] {
      border-bottom: 1px dashed transparent !important;
      outline: none !important;
      box-shadow: none !important;
    }
    .html2canvas-container .no-capture {
      display: none !important;
    }

    /* 高級提示框下滑動畫 */
    @keyframes slideDown {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    const RechartsLib = window.Recharts || {};
    const { ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = RechartsLib;

    const C = {
      navy:  "#0f172a",   
      blue:  "#2563eb",   
      white: "#ffffff",
      gray:  "#64748b",   
      light: "#f8fafc",   
      gold:  "#f59e0b",
    };

    // 重構 Counter 元件，取消跑馬燈動畫，直接且即時顯示格式化後的數值
    function Counter({ target, prefix = '', suffix = '' }) {
      const displayValue = target !== undefined && target !== null ? target : 0;
      return <span>{prefix}{displayValue.toLocaleString('en-US')}{suffix}</span>;
    }

    const EditableTitle = ({ value, onSave, style, hoverBorder="1px dashed #94a3b8" }) => (
      <span
        contentEditable
        suppressContentEditableWarning
        onBlur={e => onSave(e.currentTarget.innerText)}
        onMouseEnter={e => e.currentTarget.style.borderBottom = hoverBorder}
        onMouseLeave={e => e.currentTarget.style.borderBottom = '1px dashed transparent'}
        style={{ cursor: 'text', borderBottom: '1px dashed transparent', outline: 'none', transition: 'border 0.2s', display: 'inline-block', minWidth: '30px', textAlign: 'center', ...style }}
        title="點擊修改文字"
      >
        {value}
      </span>
    );

    const defaultProducts = [
      { id: 'P1', name: '鑫穩健-A1', currency: 'TWD' },
      { id: 'P2', name: 'e指標-A1', currency: 'TWD' },
      { id: 'P3', name: '環球總報酬', currency: 'TWD' }
    ];

    const defaultClientState = {
      clientName: "新客戶",
      reportTitle: "115 年度 投資配息與再投入績效追蹤",
      accounts: [
        { id: 'A1', name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' },
        { id: 'A2', name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' }
      ],
      theme: {
        accountColors: { A1: "#2563eb", A2: "#0891b2" },
        lineTotal: "#f59e0b", heroBg: "#1e293b"
      },
      rawMonthlyData: [
        { month: '1月', A1: 0, A2: 0 }, { month: '2月', A1: 0, A2: 0 },
        { month: '3月', A1: 0, A2: 0 }, { month: '4月', A1: 0, A2: 0 },
        { month: '5月', A1: 0, A2: 0 }, { month: '6月', A1: 0, A2: 0 },
        { month: '7月', A1: 0, A2: 0 }, { month: '8月', A1: 0, A2: 0 },
        { month: '9月', A1: 0, A2: 0 }, { month: '10月', A1: 0, A2: 0 },
        { month: '11月', A1: 0, A2: 0 }, { month: '12月', A1: 0, A2: 0 }
      ],
      eventRecords: []
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard'); 
      const [isSaving, setIsSaving] = useState(false);
      const [savedImage, setSavedImage] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState({ show: false, id: null, type: '' });
      
      const [bgImage, setBgImage] = useState(null);
      const [bgOpacity, setBgOpacity] = useState(0.85); 

      const [searchSurname, setSearchSurname] = useState("");

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };
      
      const [batchIndex, setBatchIndex] = useState(-1); 
      const [batchSavedImages, setBatchSavedImages] = useState([]); 
      const [originalClientIdBeforeBatch, setOriginalClientIdBeforeBatch] = useState(null); 

      // 載入客戶資料
      const [clients, setClients] = useState(() => {
        try { const local = localStorage.getItem('investment_crm_clients_v3'); if (local) return JSON.parse(local); } catch (e) {}
        return [{ id: `C${Date.now()}`, ...defaultClientState }];
      });
      const [activeClientId, setActiveClientId] = useState(clients[0]?.id);
      useEffect(() => { localStorage.setItem('investment_crm_clients_v3', JSON.stringify(clients)); }, [clients]);

      // 全域字體縮放設定狀態 (跨客戶共享，修改一次，套用至所有客戶)
      const [globalFontScales, setGlobalFontScales] = useState(() => {
        try {
          const local = localStorage.getItem('investment_global_font_scales_v1');
          if (local) return JSON.parse(local);
        } catch (e) {}
        // 預設縮放值：整體 1.25x (125%)
        return { global: 1.25, header: 1, kpi: 1, chart: 1, table: 1, events: 1 };
      });

      useEffect(() => {
        localStorage.setItem('investment_global_font_scales_v1', JSON.stringify(globalFontScales));
      }, [globalFontScales]);

      // 快速批次配息更新文字區狀態與解析後預覽行
      const [batchDividendInput, setBatchDividendInput] = useState('');
      const [parsedBatchUpdateRows, setParsedBatchUpdateRows] = useState([]);
      
      const [showQuickCreateModal, setShowQuickCreateModal] = useState(false);
      
      const getRocTodayStr = () => {
        const d = new Date();
        const rocYear = d.getFullYear() - 1911;
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${rocYear}/${mm}/${dd}`;
      };

      const [batchImportText, setBatchImportText] = useState('');

      const [savedThemes, setSavedThemes] = useState(() => {
        try { const local = localStorage.getItem('investment_color_themes_v6'); return local ? JSON.parse(local) : []; } catch (e) { return []; }
      });
      const [isNamingTheme, setIsNamingTheme] = useState(false);
      const [themeNameInput, setThemeNameInput] = useState("");

      const [products, setProducts] = useState(() => {
        try { const local = localStorage.getItem('investment_crm_products_v2'); if (local) return JSON.parse(local); } catch (e) {}
        return defaultProducts;
      });
      useEffect(() => { localStorage.setItem('investment_crm_products_v2', JSON.stringify(products)); }, [products]);

      const activeClient = batchIndex !== -1 
        ? (clients[batchIndex] || clients[0]) 
        : (clients.find(c => c.id === activeClientId) || clients[0]);

      const updateActiveClientField = (field, valueOrUpdater) => {
        setClients(prevClients => prevClients.map(c => {
          if (c.id !== activeClientId) return c;
          const newValue = typeof valueOrUpdater === 'function' ? valueOrUpdater(c[field]) : valueOrUpdater;
          return { ...c, [field]: newValue };
        }));
      };

      const clientName = activeClient.clientName;
      const setClientName = (v) => updateActiveClientField('clientName', v);
      const reportTitle = activeClient.reportTitle || "115 年度 投資配息與再投入績效追蹤";
      const setReportTitle = (v) => updateActiveClientField('reportTitle', v);
      const accounts = activeClient.accounts;
      const setAccounts = (v) => updateActiveClientField('accounts', v);
      const theme = activeClient.theme;
      const setTheme = (v) => updateActiveClientField('theme', v);
      const rawMonthlyData = activeClient.rawMonthlyData;
      const setRawMonthlyData = (v) => updateActiveClientField('rawMonthlyData', v);
      const eventRecords = activeClient.eventRecords;
      const setEventRecords = (v) => updateActiveClientField('eventRecords', v);

      const getTitle = (key, defaultStr) => activeClient.dashboardTitles?.[key] !== undefined ? activeClient.dashboardTitles[key] : defaultStr;
      const updateTitle = (key, val) => setClients(prev => prev.map(c => c.id === activeClientId ? { ...c, dashboardTitles: { ...(c.dashboardTitles || {}), [key]: val } } : c));

      // 直接使用全域的字體縮放設定
      const fontScales = globalFontScales;

      const updateScale = (key, delta) => {
        setGlobalFontScales(prev => {
          const newVal = Math.min(3, Math.max(0.4, (prev[key] || 1) + delta));
          return { ...prev, [key]: parseFloat(newVal.toFixed(2)) };
        });
      };

      const sGlobal = fontScales.global || 1;
      const sHeader = sGlobal * (fontScales.header || 1);
      const sKpi    = sGlobal * (fontScales.kpi || 1);
      const sChart  = sGlobal * (fontScales.chart || 1);
      const sTable  = sGlobal * (fontScales.table || 1);
      const sEvents = sGlobal * (fontScales.events || 1);

      const [colScales, setColScales] = useState({ policy: 1, date: 1, name: 1, unit: 1, invest: 1, monthly: 1 });
      const updateColScale = (key, delta) => setColScales(prev => ({ ...prev, [key]: Math.min(3, Math.max(0.4, prev[key] + delta)) }));
      
      const ScaleButtons = ({ scaleKey }) => (
        !isSaving ? (
          <div className="no-capture" style={{ display: 'inline-flex', background: '#f1f5f9', borderRadius: '6px', overflow: 'hidden', flexShrink: 0, marginLeft: '6px', boxShadow: 'inset 0 1px 2px rgba(0,0,0,0.05)' }}>
            <button onClick={() => updateColScale(scaleKey, -0.1)} style={{ background: 'transparent', border: 'none', padding: '2px 8px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold', color: C.gray }} title="縮小">-</button>
            <button onClick={() => updateColScale(scaleKey, 0.1)} style={{ background: 'transparent', border: 'none', padding: '2px 8px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold', color: C.gray }} title="放大">+</button>
          </div>
        ) : null
      );

      const ScaleControl = ({ label, scaleKey }) => {
        const val = fontScales[scaleKey] || 1;
        return (
          <div style={{ display: 'flex', alignItems: 'center', background: '#ffffff', borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 2px 4px rgba(0,0,0,0.02)', overflow: 'hidden', flexShrink: 0 }}>
            <span style={{ padding: '6px 10px', fontSize: '12px', color: '#64748b', borderRight: '1px solid #e2e8f0', background: '#f8fafc', whiteSpace: 'nowrap', fontWeight: 'bold' }}>{label}</span>
            <button onClick={() => updateScale(scaleKey, -0.05)} style={{ background: 'transparent', color: '#334155', border: 'none', cursor: 'pointer', padding: '6px 10px', fontSize: '14px', fontWeight: 'bold' }}>-</button>
            <span style={{ color: '#2563eb', fontSize: '12px', fontWeight: '900', minWidth: '42px', textAlign: 'center' }}>{Math.round(val * 100)}%</span>
            <button onClick={() => updateScale(scaleKey, 0.05)} style={{ background: 'transparent', color: '#334155', border: 'none', cursor: 'pointer', padding: '6px 10px', fontSize: '14px', fontWeight: 'bold' }}>+</button>
          </div>
        );
      };

      const getSym = (curr) => curr === 'USD' ? 'US$' : 'NT$';
      const globalSym = (() => { const currs = [...new Set(accounts.map(a => a.currency || 'TWD'))]; return currs.length === 1 ? getSym(currs[0]) : '$'; })();
      
      const parseChineseAmount = (val) => {
        if (!val) return 0;
        const str = String(val).trim();
        if (/[萬万]/.test(str)) {
          const num = parseFloat(str.replace(/[萬万]/g, ''));
          return isNaN(num) ? 0 : num * 10000;
        }
        const num = parseFloat(str.replace(/[^0-9.-]/g, ''));
        return isNaN(num) ? 0 : num;
      };

      const parseAmount = (val) => parseChineseAmount(val);

      const accountTotals = accounts.map(acc => {
        const eventSum = eventRecords.filter(e => e.target === acc.id).reduce((s, e) => s + parseAmount(e.amount), 0);
        const totalInvest = Number(acc.invest) + eventSum;
        const totalDividend = rawMonthlyData.reduce((s, d) => s + (Number(d[acc.id]) || 0), 0);
        return { ...acc, eventSum, totalInvest, totalDividend };
      });
      const finalTotal = accountTotals.reduce((s, acc) => s + acc.totalDividend, 0);

      const groupedByPolicy = [];
      const policyMap = {};
      accountTotals.forEach(acc => {
        const pKey = (acc.acc || '').trim() || acc.id; 
        if (!policyMap[pKey]) {
          policyMap[pKey] = { 
            key: pKey, 
            policyNo: (acc.acc || '').trim() || '未命名保單', 
            policyDate: acc.policyDate || '', 
            names: [acc.name || '未選擇標的'], 
            totalDividend: 0, 
            totalInvest: 0, 
            currency: acc.currency, 
            color: theme.accountColors[acc.id] || '#2563eb', 
            accounts: [] 
          };
          groupedByPolicy.push(policyMap[pKey]);
        } else {
          policyMap[pKey].names.push(acc.name || '未選擇標的');
        }
        policyMap[pKey].accounts.push(acc);
        policyMap[pKey].totalDividend += acc.totalDividend;
        policyMap[pKey].totalInvest += acc.totalInvest;
        if (policyMap[pKey].currency !== acc.currency) policyMap[pKey].currency = 'MIXED';
      });

      const cardStyle = {
        background: bgImage ? `rgba(255, 255, 255, ${bgOpacity})` : '#ffffff',
        borderRadius: '24px',
        padding: '24px',
        boxShadow: bgImage ? '0 10px 30px rgba(0,0,0,0.06)' : '0 20px 40px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02)',
        border: bgImage ? '1px solid rgba(255,255,255,0.4)' : '1px solid #f1f5f9',
        display: 'flex',
        flexDirection: 'column',
        transition: 'all 0.3s ease',
        backdropFilter: bgImage ? 'blur(10px)' : 'none',
      };

      const policyCumSums = {};
      groupedByPolicy.forEach(group => {
        policyCumSums[group.key] = 0;
      });

      let lastActiveIndex = -1;
      rawMonthlyData.forEach((row, idx) => {
        let hasData = false;
        accounts.forEach(acc => {
          const val = Number(row[acc.id]) || 0;
          if (val > 0) {
            hasData = true;
          }
        });
        if (hasData) {
          lastActiveIndex = idx;
        }
      });
      if (lastActiveIndex === -1) {
        lastActiveIndex = 0;
      }

      let currentCum = 0;
      const monthlyData = rawMonthlyData.map((d, idx) => {
        let sumThisMonth = 0;
        const newD = { month: d.month };
        
        const groupSumsThisMonth = {};
        groupedByPolicy.forEach(group => {
          let groupSumThisMonth = 0;
          group.accounts.forEach(acc => {
            const val = Number(d[acc.id]) || 0;
            sumThisMonth += val;
            groupSumThisMonth += val;
            newD[acc.id] = val; 
          });
          groupSumsThisMonth[group.key] = groupSumThisMonth;
        });

        currentCum += sumThisMonth;

        groupedByPolicy.forEach(group => {
          policyCumSums[group.key] += groupSumsThisMonth[group.key];
          if (idx <= lastActiveIndex) {
            newD[`policy_${group.key}`] = policyCumSums[group.key];
          } else {
            newD[`policy_${group.key}`] = null; 
          }
        });

        if (idx <= lastActiveIndex) {
          newD.TotalCum = currentCum;
        } else {
          newD.TotalCum = null; 
        }
        
        newD.monthlyTotal = sumThisMonth;     
        return newD;
      });

      let totalCash = 0; 
      let totalUnits = 0; 
      rawMonthlyData.forEach(row => {
        accounts.forEach(acc => {
          const amount = Number(row[acc.id]) || 0;
          const type = row[`${acc.id}_type`] || '現金給付';
          if (type === '現金給付') {
            totalCash += amount;
          } else if (type === '累積單位數') {
            totalUnits += amount;
          }
        });
      });

      const filteredClients = clients.filter(c => {
        if (!searchSurname.trim()) return true;
        return c.clientName.trim().includes(searchSurname.trim());
      });

      const handleAddProduct = () => setProducts([...products, { id: `P${Date.now()}`, name: `新標的 ${products.length + 1}`, currency: 'TWD' }]);
      const handleUpdateProduct = (id, field, value) => setProducts(products.map(p => p.id === id ? { ...p, [field]: value } : p));
      const handleAddClient = () => { const newId = `C${Date.now()}`; setClients([...clients, { ...JSON.parse(JSON.stringify(defaultClientState)), id: newId, clientName: `新客戶 ${clients.length + 1}` }]); setActiveClientId(newId); };
      const handleAddAccount = () => { const newId = `A${Date.now()}`; setAccounts(prev => [...prev, { id: newId, name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' }]); setTheme(prev => ({ ...prev, accountColors: { ...prev.accountColors, [newId]: getRandomColor() } })); setRawMonthlyData(rawMonthlyData.map(d => ({ ...d, [newId]: 0 }))); };
      const handleAccountChange = (id, field, value) => setAccounts(prev => prev.map(a => a.id === id ? { ...a, [field]: value } : a));
      const handleDataChange = (i, accountId, v) => setRawMonthlyData(prev => { const nd = [...prev]; nd[i] = { ...nd[i], [accountId]: v === '' ? '' : Number(v) }; return nd; }); 
      const handleTypeChange = (i, accountId, v) => setRawMonthlyData(prev => { const nd = [...prev]; nd[i] = { ...nd[i], [`${accountId}_type`]: v }; return nd; });
      const handleUpdateEvent = (id, f, v) => setEventRecords(prev => prev.map(e => e.id === id ? { ...e, [f]: v } : e));
      const handleRemoveEvent = (id) => setEventRecords(prev => prev.filter(e => e.id !== id));
      const handleAddEvent = () => setEventRecords(prev => [...prev, { id: Date.now(), icon: '💰', date: '', amount: '0', target: accounts[0]?.id || '', currency: 'TWD' }]);
      
      const handleBgUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setBgImage(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      const findBestGlobalMatch = (policyNoInput, clientNameInput, fundInput) => {
        let bestMatch = null;
        let highestScore = 0;

        const cleanPolicyInput = String(policyNoInput || '').trim();
        const cleanClientNameInput = String(clientNameInput || '').trim();
        const cleanFundInput = String(fundInput || '').trim();

        clients.forEach(client => {
          // 評估客戶姓名相符度 (提高權重)
          const dbClientName = String(client.clientName || '').trim();
          let clientScore = 0;
          if (dbClientName && cleanClientNameInput) {
            if (dbClientName === cleanClientNameInput) {
              clientScore += 50;
            } else if (dbClientName.includes(cleanClientNameInput) || cleanClientNameInput.includes(dbClientName)) {
              clientScore += 25;
            }
          }

          client.accounts.forEach(acc => {
            let score = clientScore;
            const dbAcc = String(acc.acc || '').trim();
            const dbName = String(acc.name || '').trim();

            if (dbAcc && cleanPolicyInput) {
              if (dbAcc === cleanPolicyInput) {
                score += 100;
              } else if (dbAcc.endsWith(cleanPolicyInput) || cleanPolicyInput.endsWith(dbAcc)) {
                score += 65;
              }
            }

            if (dbName && cleanFundInput) {
              if (dbName === cleanFundInput) {
                score += 40;
              } else if (dbName.includes(cleanFundInput) || cleanFundInput.includes(dbName)) {
                score += 25;
              }
            }

            if (score > highestScore && score >= 20) {
              highestScore = score;
              bestMatch = {
                clientId: client.id,
                clientName: client.clientName,
                accountId: acc.id,
                policyNo: dbAcc,
                fundName: dbName
              };
            }
          });
        });

        return bestMatch;
      };

      const handleParseBatchDividendInput = (text) => {
        if (!text.trim()) {
          setParsedBatchUpdateRows([]);
          return;
        }

        // 收集目前系統資料庫內所有已登記的保單號碼 (去空白，過濾空值)
        const registeredPolicies = clients.flatMap(c => 
          (c.accounts || []).map(a => String(a.acc || '').trim())
        ).filter(Boolean);

        const lines = text.split('\n');
        let hasUnregisteredPolicy = false;
        let unregisteredNumbers = [];

        const rows = lines.map((line, idx) => {
          const cleanLine = line.trim();
          if (!cleanLine) return null;

          const parts = cleanLine.split(/[,，\t|/]+/).map(p => p.trim());
          
          if (parts.length < 7) {
            return {
              lineIndex: idx + 1,
              rawText: cleanLine,
              status: 'error',
              message: '格式欄位不足（需包含：保單號碼, 客戶姓名, 基金標的, 最新基準日單位數, 月份, 配息金額, 給付方式）',
              selectedClientId: '',
              selectedAccountId: '',
              units: 0,
              dividends: []
            };
          }

          const policyNoInput = parts[0];
          const clientNameInput = parts[1];
          const fundInput = parts[2];
          const unitsInput = parseFloat(parts[3]) || 0;

          // 核心防護校驗：確認保單號碼是否存在於現有資料庫中
          const isPolicyExists = registeredPolicies.includes(String(policyNoInput).trim());

          if (!isPolicyExists) {
            hasUnregisteredPolicy = true;
            if (!unregisteredNumbers.includes(policyNoInput)) {
              unregisteredNumbers.push(policyNoInput);
            }
            return {
              lineIndex: idx + 1,
              rawText: cleanLine,
              status: 'error',
              message: `❌ 錯誤：保單號碼 [${policyNoInput}] 不存在於系統中！資料已被鎖定，無法進行批次更新。`,
              selectedClientId: '',
              selectedAccountId: '',
              units: unitsInput,
              dividends: []
            };
          }

          const match = findBestGlobalMatch(policyNoInput, clientNameInput, fundInput);

          const dividends = [];
          for (let i = 4; i < parts.length; i += 3) {
            const mInput = parts[i];
            const aInput = parts[i+1];
            const tInput = parts[i+2] || '現金給付';

            if (mInput && aInput) {
              const month = mInput.endsWith('月') ? mInput : mInput + '月';
              const amount = parseChineseAmount(aInput);
              const type = (tInput.includes('單位') || tInput.includes('累積') || tInput.includes('再投入')) ? '累積單位數' : '現金給付';
              
              dividends.push({
                id: Date.now() + Math.random().toString(36).substr(2, 5),
                month,
                amount,
                type
              });
            }
          }

          if (dividends.length === 0) {
            return {
              lineIndex: idx + 1,
              rawText: cleanLine,
              status: 'error',
              message: '配息月份與金額解析失敗，請確認最後配息三項欄位是否填寫正確',
              selectedClientId: match ? match.clientId : '',
              selectedAccountId: match ? match.accountId : '',
              units: unitsInput,
              dividends: []
            };
          }

          return {
            lineIndex: idx + 1,
            rawText: cleanLine,
            status: match ? 'success' : 'warning',
            message: match 
              ? `智慧媒合成功：${match.clientName} 的保單 [${match.policyNo}]`
              : `查無此保單或客戶，請利用右側面板手動對應連結`,
            selectedClientId: match ? match.clientId : '',
            selectedAccountId: match ? match.accountId : '',
            units: unitsInput,
            dividends
          };
        }).filter(Boolean);

        setParsedBatchUpdateRows(rows);

        if (hasUnregisteredPolicy) {
          showToast(`❌ 警告：保單 [${unregisteredNumbers.join(', ')}] 不存在於資料庫中，已全面阻斷更新！`, 'error');
        } else {
          const successCount = rows.filter(r => r.status === 'success').length;
          const totalCount = rows.length;
          if (successCount === totalCount) {
            showToast(`🔍 智慧解析 ${successCount} 筆保單更新資訊，已全部完美匹配！`, 'success');
          } else {
            showToast(`⚠️ 解析完畢（共 ${totalCount} 筆），其中 ${totalCount - successCount} 筆保單需要您於右側手動修正對應關係。`, 'warning');
          }
        }
      };

      const handleApplyBatchDividendUpdates = () => {
        // 二次保險防線：檢查解析結果是否依然包含錯誤保單
        const hasCriticalError = parsedBatchUpdateRows.some(r => r.status === 'error');
        if (hasCriticalError) {
          showToast('❌ 無法更新！名單中包含錯誤或不存在的保單資料，請先修正或刪除錯誤卡片。', 'error');
          return;
        }

        const validRows = parsedBatchUpdateRows.filter(r => r.selectedClientId && r.selectedAccountId);
        if (validRows.length === 0) {
          showToast('目前沒有可供更新的成功匹配或手動對應資料！', 'error');
          return;
        }

        setClients(prevClients => {
          return prevClients.map(client => {
            const updatesForClient = validRows.filter(r => r.selectedClientId === client.id);
            if (updatesForClient.length === 0) return client;

            // 1. 更新指定帳戶的「最新基準日單位數」
            const updatedAccounts = client.accounts.map(acc => {
              const accUpdate = updatesForClient.find(r => r.selectedAccountId === acc.id);
              if (accUpdate) {
                return { ...acc, units: accUpdate.units };
              }
              return acc;
            });

            // 2. 更新每月撥回配息數據
            let updatedMonthlyData = [...client.rawMonthlyData];

            updatesForClient.forEach(row => {
              const accountId = row.selectedAccountId;
              row.dividends.forEach(div => {
                const monthIdx = updatedMonthlyData.findIndex(m => m.month === div.month);
                if (monthIdx !== -1) {
                  updatedMonthlyData[monthIdx] = {
                    ...updatedMonthlyData[monthIdx],
                    [accountId]: div.amount,
                    [`${accountId}_type`]: div.type
                  };
                }
              });
            });

            return {
              ...client,
              accounts: updatedAccounts,
              rawMonthlyData: updatedMonthlyData
            };
          });
        });

        showToast(`🎉 成功更新 ${validRows.length} 筆保單之最新單位數及月配息數據！`, 'success');
        setBatchDividendInput('');
        setParsedBatchUpdateRows([]);
      };

      // 批量編輯面板的狀態變更處理函式
      const handleRowClientChange = (lineIndex, clientId) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          const targetClient = clients.find(c => c.id === clientId);
          const firstAccount = targetClient?.accounts?.[0]?.id || '';
          return {
            ...row,
            selectedClientId: clientId,
            selectedAccountId: firstAccount,
            status: clientId && firstAccount ? 'success' : 'warning',
            message: clientId && firstAccount 
              ? `手動指定：${targetClient.clientName}` 
              : '請選擇對應的保單 / 基金標的'
          };
        }));
      };

      const handleRowAccountChange = (lineIndex, accountId) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          const targetClient = clients.find(c => c.id === row.selectedClientId);
          const targetAcc = targetClient?.accounts?.find(a => a.id === accountId);
          return {
            ...row,
            selectedAccountId: accountId,
            status: row.selectedClientId && accountId ? 'success' : 'warning',
            message: row.selectedClientId && accountId 
              ? `手動指定：${targetClient.clientName} [${targetAcc?.acc || '未命名保單'}]` 
              : '請選擇對應的保單 / 基金標的'
          };
        }));
      };

      const handleRowUnitsChange = (lineIndex, value) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          return { ...row, units: parseFloat(value) || 0 };
        }));
      };

      const handleRowDividendChange = (lineIndex, divId, field, value) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          const updatedDividends = row.dividends.map(div => {
            if (div.id !== divId) return div;
            return { ...div, [field]: field === 'amount' ? (parseFloat(value) || 0) : value };
          });
          return { ...row, dividends: updatedDividends };
        }));
      };

      const handleDeleteRowDividend = (lineIndex, divId) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          return { ...row, dividends: row.dividends.filter(d => d.id !== divId) };
        }));
      };

      const handleAddRowDividend = (lineIndex) => {
        setParsedBatchUpdateRows(prev => prev.map(row => {
          if (row.lineIndex !== lineIndex) return row;
          return {
            ...row,
            dividends: [
              ...row.dividends,
              {
                id: Date.now() + Math.random().toString(36).substr(2, 5),
                month: '1月',
                amount: 0,
                type: '現金給付'
              }
            ]
          };
        }));
      };

      const handleDeleteRow = (lineIndex) => {
        setParsedBatchUpdateRows(prev => prev.filter(row => row.lineIndex !== lineIndex));
      };

      const handleQuickCreateSubmit = () => {
        if (!batchImportText.trim()) {
          showToast('請貼入批次資料文字！', 'error');
          return;
        }

        const lines = batchImportText.split('\n');
        const clientGroups = {}; 

        lines.forEach(line => {
          if (!line.trim()) return;
          const parts = line.split(/[,，\t]+/).map(p => p.trim());
          if (parts.length === 0 || !parts[1]) return; 

          const policyNo = parts[0] || '';
          const name = parts[1];
          const policyDate = parts[2] || getRocTodayStr();
          const fundInput = parts[3] || '環球總報酬';

          const invest = 0;
          const units = 0;

          const parsedDividends = [];
          for (let i = 4; i < parts.length && parsedDividends.length < 6; i += 3) {
            const divMonth = parts[i] || '';
            const divAmount = parts[i+1] || '';
            const divType = parts[i+2] || '累積單位數';

            if (divMonth && divMonth !== '無' && divAmount) {
              parsedDividends.push({
                month: divMonth.endsWith('月') ? divMonth : divMonth + '月',
                amount: parseChineseAmount(divAmount),
                type: (divType.includes('單位') || divType.includes('累積') || divType.includes('再投入')) ? '累積單位數' : '現金給付'
              });
            }
          }

          let matchedFund = fundInput;
          let matchedCurrency = 'TWD';
          const fuzzy = products.find(p => p.name.includes(fundInput) || fundInput.includes(p.name));
          if (fuzzy) {
            matchedFund = fuzzy.name;
            matchedCurrency = fuzzy.currency || 'TWD';
          }

          if (!clientGroups[name]) {
            clientGroups[name] = [];
          }

          clientGroups[name].push({
            acc: policyNo,
            name: matchedFund,
            policyDate: policyDate,
            invest: invest,
            units: units,
            currency: matchedCurrency,
            dividends: parsedDividends
          });
        });

        const createdClients = [];
        Object.keys(clientGroups).forEach((name, cIdx) => {
          const policies = clientGroups[name];
          const accountsList = policies.map((p, idx) => ({
            id: `A${idx + 1}`,
            name: p.name,
            acc: p.acc,
            policyDate: p.policyDate,
            invest: p.invest,
            units: p.units,
            currency: p.currency
          }));

          const rawMonthlyData = Array.from({ length: 12 }, (_, i) => {
            const row = { month: `${i + 1}月` };
            accountsList.forEach((acc, aIdx) => {
              row[acc.id] = 0;
              row[`${acc.id}_type`] = '現金給付';
              
              const originalPolicy = policies[aIdx];
              if (originalPolicy && originalPolicy.dividends && originalPolicy.dividends.length > 0) {
                const matchedDiv = originalPolicy.dividends.find(div => div.month === row.month);
                if (matchedDiv) {
                  row[acc.id] = matchedDiv.amount;
                  row[`${acc.id}_type`] = matchedDiv.type;
                }
              }
            });
            return row;
          });

          const accountColors = {};
          const palette = ["#2563eb", "#0891b2", "#8b5cf6", "#10b981", "#f59e0b", "#ec4899"];
          accountsList.forEach((acc, idx) => {
            accountColors[acc.id] = palette[idx % palette.length];
          });

          const newClientObj = {
            id: `C${Date.now()}_${cIdx}_${Math.random().toString(36).substr(2, 5)}`,
            clientName: name,
            reportTitle: "115 年度 投資配息與再投入績效追蹤",
            accounts: accountsList,
            theme: {
              accountColors: accountColors,
              lineTotal: "#f59e0b",
              heroBg: "#1e293b"
            },
            rawMonthlyData: rawMonthlyData,
            eventRecords: []
          };

          createdClients.push(newClientObj);
        });

        if (createdClients.length === 0) {
          showToast('⚠️ 未能成功解析任何客戶資料，請檢查格式。', 'error');
          return;
        }

        setClients(prev => [...prev, ...createdClients]);
        setActiveClientId(createdClients[0].id); 
        setBatchImportText('');
        setShowQuickCreateModal(false);
        setActiveTab('data');

        showToast('🎉 成功大量建立新客戶名下多月份歷史配息！', 'success');
      };

      const confirmDeleteAction = () => {
        if (deleteConfirm.type === 'event') handleRemoveEvent(deleteConfirm.id);
        else if (deleteConfirm.type === 'theme') { const nt = savedThemes.filter(t => t.id !== deleteConfirm.id); setSavedThemes(nt); localStorage.setItem('investment_color_themes_v6', JSON.stringify(nt)); }
        else if (deleteConfirm.type === 'account') setAccounts(accounts.filter(a => a.id !== deleteConfirm.id));
        else if (deleteConfirm.type === 'month') setRawMonthlyData(rawMonthlyData.filter((_, i) => i !== deleteConfirm.id));
        else if (deleteConfirm.type === 'client') { 
          const newClients = clients.filter(c => c.id !== deleteConfirm.id); 
          setClients(newClients); 
          if (activeClientId === deleteConfirm.id) setActiveClientId(newClients[0].id); 
        }
        else if (deleteConfirm.type === 'product') setProducts(products.filter(p => p.id !== deleteConfirm.id));
        setDeleteConfirm({ show: false, id: null, type: '' });
      };

      const handleRandomizeColors = () => {
        const newColors = {};
        accounts.forEach(acc => newColors[acc.id] = getRandomColor());
        setTheme({
          accountColors: newColors,
          lineTotal: getRandomColor(),
          heroBg: getRandomColor()
        });
      };

      const getRandomColor = () => {
        const l = '3456789ABCDEF';
        let c = '#';
        for (let i = 0; i < 6; i++) {
          c += l[Math.floor(Math.random() * 13)];
        }
        return c;
      };

      const handleColorChange = (accId, color) => {
        setTheme(prev => ({
          ...prev,
          accountColors: {
            ...(prev.accountColors || {}),
            [accId]: color
          }
        }));
      };

      const confirmSaveTheme = () => {
        const name = themeNameInput.trim() || `配色 ${savedThemes.length + 1}`;
        const nt = [...savedThemes, { id: Date.now(), name, colors: { ...theme } }];
        setSavedThemes(nt);
        localStorage.setItem('investment_color_themes_v6', JSON.stringify(nt));
        setIsNamingTheme(false);
        setThemeNameInput("");
      };

      const reportRef = useRef(null);
      
      const handleSaveImage = () => {
        if (activeTab !== 'dashboard') return;
        setIsSaving(true);
        
        if (!window.html2canvas) {
          showToast('系統未載入截圖套件，請檢查網路狀態。', 'error');
          setIsSaving(false);
          return;
        }

        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }

        setTimeout(() => {
          const element = reportRef.current;
          if (!element) {
            setIsSaving(false);
            return;
          }

          window.html2canvas(element, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: null, 
            logging: false,
            onclone: (clonedDoc) => {
              const target = clonedDoc.querySelector('[ref="reportRef"]') || clonedDoc.body;
              target.classList.add('html2canvas-container');
              
              clonedDoc.querySelectorAll('[contenteditable]').forEach(el => {
                el.removeAttribute('contenteditable');
                el.style.outline = 'none';
                el.style.border = 'none';
                el.style.borderBottom = 'none';
                el.style.boxShadow = 'none';
                el.style.textShadow = 'none';
              });

              clonedDoc.querySelectorAll('*').forEach(el => {
                const computedStyle = window.getComputedStyle(el);
                if (el.style.backdropFilter || computedStyle.backdropFilter !== 'none') {
                  el.style.backdropFilter = 'none';
                  if (el.style.background && el.style.background.includes('rgba(255, 255, 255')) {
                    el.style.background = 'rgba(255, 255, 255, 0.98)';
                  }
                  if (el.style.background && el.style.background.includes('rgba(241, 245, 249')) {
                    el.style.background = '#f1f5f9';
                  }
                }
              });

              const clientNameBox = clonedDoc.querySelector('.report-client-name-container');
              if (clientNameBox) {
                clientNameBox.style.backdropFilter = 'none';
                clientNameBox.style.background = '#f1f5f9';
                clientNameBox.style.border = '1px solid #cbd5e1';
                clientNameBox.style.display = 'inline-block';
                clientNameBox.style.position = 'static'; 
                clientNameBox.style.transform = 'none';
              }
            }
          }).then(cvs => {
            setSavedImage(cvs.toDataURL('image/jpeg', 0.95));
            setIsSaving(false);
          }).catch(e => {
            console.error("截圖錯誤:", e);
            showToast('圖片生成失敗，可能是因為裝置記憶體不足。', 'error');
            setIsSaving(false);
          });
        }, 500);
      };

      useEffect(() => {
        if (batchIndex === -1) return;

        const runCapturePass = () => {
          const timer = setTimeout(() => {
            const element = reportRef.current;
            if (!element) {
              handleNextBatchSkip();
              return;
            }

            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }

            window.html2canvas(element, {
              scale: 2,
              useCORS: true,
              backgroundColor: null,
              logging: false,
              onclone: (clonedDoc) => {
                const target = clonedDoc.querySelector('[ref="reportRef"]') || clonedDoc.body;
                target.classList.add('html2canvas-container');
                
                clonedDoc.querySelectorAll('[contenteditable]').forEach(el => {
                  el.removeAttribute('contenteditable');
                  el.style.outline = 'none';
                  el.style.border = 'none';
                  el.style.borderBottom = 'none';
                  el.style.boxShadow = 'none';
                });

                clonedDoc.querySelectorAll('*').forEach(el => {
                  const computedStyle = window.getComputedStyle(el);
                  if (el.style.backdropFilter || computedStyle.backdropFilter !== 'none') {
                    el.style.backdropFilter = 'none';
                    if (el.style.background && el.style.background.includes('rgba(255, 255, 255')) {
                      el.style.background = 'rgba(255, 255, 255, 0.98)';
                    }
                    if (el.style.background && el.style.background.includes('rgba(241, 245, 249')) {
                      el.style.background = '#f1f5f9';
                    }
                  }
                });

                const clientNameBox = clonedDoc.querySelector('.report-client-name-container');
                if (clientNameBox) {
                  clientNameBox.style.backdropFilter = 'none';
                  clientNameBox.style.background = '#f1f5f9';
                  clientNameBox.style.border = '1px solid #cbd5e1';
                  clientNameBox.style.display = 'inline-block';
                  clientNameBox.style.position = 'static';
                  clientNameBox.style.transform = 'none';
                }
              }
            }).then(cvs => {
              const dataUrl = cvs.toDataURL('image/jpeg', 0.95);
              const currentClient = clients[batchIndex];

              setBatchSavedImages(prev => {
                const nextList = [...prev, { 
                  name: currentClient.clientName || `客戶_${batchIndex + 1}`, 
                  dataUrl 
                }];

                if (batchIndex === clients.length - 1) {
                  triggerZipPackingAndDownload(nextList);
                } else {
                  setBatchIndex(prevIdx => prevIdx + 1);
                }
                return nextList;
              });
            }).catch(e => {
              console.error("批量截圖錯誤, 索引：", batchIndex, e);
              handleNextBatchSkip();
            });
          }, 900);

          return () => clearTimeout(timer);
        };

        const handleNextBatchSkip = () => {
          if (batchIndex === clients.length - 1) {
            triggerZipPackingAndDownload(batchSavedImages);
          } else {
            setBatchIndex(prevIdx => prevIdx + 1);
          }
        };

        return runCapturePass();
      }, [batchIndex]);

      const triggerZipPackingAndDownload = (images) => {
        if (!window.JSZip) {
          showToast('無法載入壓縮套件，匯出失敗。', 'error');
          resetBatchState();
          return;
        }

        const zip = new JSZip();
        const usedNames = {};

        images.forEach((img) => {
          let safeName = (img.name || '').trim().replace(/[/\\?%*:|"<>. ]/g, '_');
          if (!safeName) safeName = '未命名客戶';

          if (usedNames[safeName] !== undefined) {
            usedNames[safeName] += 1;
            safeName = `${safeName}_${usedNames[safeName]}`;
          } else {
            usedNames[safeName] = 0;
          }

          const base64Data = img.dataUrl.split(',')[1];
          zip.file(`${safeName}.jpg`, base64Data, { base64: true });
        });

        zip.generateAsync({ type: 'blob' }).then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
          a.download = `全體客戶投資報表打包_${dateStr}.zip`;
          a.click();
          URL.revokeObjectURL(url);

          showToast(`✨ 成功匯出 ${images.length} 位客戶高清報表！`, 'success');
          resetBatchState();
        }).catch(err => {
          console.error("ZIP 壓縮出錯：", err);
          showToast('壓縮打包時發生未知錯誤！', 'error');
          resetBatchState();
        });
      };

      const resetBatchState = () => {
        setIsSaving(false);
        setBatchIndex(-1);
        setBatchSavedImages([]);
        if (originalClientIdBeforeBatch) {
          setActiveClientId(originalClientIdBeforeBatch);
        }
      };

      const handleImportData = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.clients) { setClients(data.clients); setActiveClientId(data.clients[0]?.id); }
            if (data.products) setProducts(data.products);
            if (data.savedThemes) setSavedThemes(data.savedThemes);
            if (data.globalFontScales) setGlobalFontScales(data.globalFontScales);
            showToast('✅ 資料還原成功！', 'success');
          } catch (err) {
            showToast('❌ 檔案格式錯誤，請確認您上傳的是正確的 .json 備份檔！', 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleExportData = () => {
        const backupData = {
          exportDate: new Date().toLocaleString('zh-TW'),
          clients: clients,
          products: products,
          savedThemes: savedThemes,
          globalFontScales: globalFontScales
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
        a.download = `投資系統備份_${dateStr}.json`;
        a.click();
      };

      const inputStyle = { background: '#f8fafc', border: '1px solid #cbd5e1', color: '#1e293b', padding: '10px 12px', borderRadius: '8px', outline: 'none', width: '100%', boxSizing: 'border-box', boxShadow: 'inset 0 1px 3px rgba(0,0,0,0.02)', fontWeight: '500', transition: 'border 0.2s' };
      const selectStyle = { ...inputStyle, cursor: 'pointer', appearance: 'none', backgroundImage: 'url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E")', backgroundRepeat: 'no-repeat', backgroundPosition: 'right .7rem top 50%', backgroundSize: '.65rem auto' };
      const labelStyle = { display: 'block', fontSize: '13px', color: '#475569', marginBottom: '8px', fontWeight: 'bold' };
      const colorInputStyle = { width: '32px', height: '32px', padding: 0, border: 'none', borderRadius: '50%', cursor: 'pointer', overflow: 'hidden', flexShrink: 0 };

      if (!activeClient) return null;

      return (
        <div style={{ 
          minHeight: '100vh', 
          padding: '24px', 
          boxSizing: 'border-box', 
          overflowX: 'hidden',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'flex-start',
          width: '100%'
        }}>
          <div style={{ maxWidth: '1400px', margin: '0 auto', width: '100%', display: 'flex', flexDirection: 'column', gap: '24px' }}>
            
            {/* 頂部 CRM 客戶切換與主要分頁導航 */}
            <div className="glass-card" style={{ display: 'flex', flexDirection: 'column', gap: '16px', padding: '24px', border: 'none', background: '#ffffff', boxShadow: '0 10px 30px rgba(0,0,0,0.04)' }}>
              
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', alignItems: 'end' }}>
                
                {/* 1. 搜尋姓氏/名稱欄位 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <label style={{ fontSize: '13px', color: '#475569', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    🔍 1. 搜尋姓氏或名稱
                  </label>
                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                    <input 
                      type="text" 
                      value={searchSurname} 
                      onChange={e => setSearchSurname(e.target.value)} 
                      placeholder="輸入姓氏篩選 (例如: 馬)..." 
                      style={{ ...inputStyle, padding: '11px 14px', background: '#f8fafc' }}
                    />
                    {searchSurname && (
                      <button 
                        onClick={() => setSearchSurname("")} 
                        style={{ background: '#cbd5e1', border: 'none', color: '#334155', padding: '11px 14px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold', fontSize: '13px' }}
                      >
                        清除
                      </button>
                    )}
                  </div>
                </div>

                {/* 2. 選擇完整名稱下拉選單 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <label style={{ fontSize: '13px', color: '#475569', fontWeight: 'bold' }}>
                    👥 2. 選擇客戶完整名稱 ({filteredClients.length} 筆資料)
                  </label>
                  <select
                    value={filteredClients.some(c => c.id === activeClientId) ? activeClientId : ""}
                    onChange={e => {
                      if (e.target.value) {
                        setActiveClientId(e.target.value);
                      }
                    }}
                    style={{ ...selectStyle, padding: '11px 14px', background: '#f8fafc', color: '#0f172a', fontWeight: 'bold' }}
                  >
                    <option value="" disabled>
                      {filteredClients.length > 0 ? "-- 請選擇選單中的客戶 --" : "-- 無符合搜尋結果的客戶 --"}
                    </option>
                    {filteredClients.map(c => (
                      <option key={c.id} value={c.id}>
                        👤 {c.clientName}
                      </option>
                    ))}
                  </select>
                </div>

                {/* 3. 快速操作管理區 */}
                <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                  <button 
                    onClick={handleAddClient} 
                    style={{ 
                      flex: '1 1 120px',
                      background: '#f0fdfa', 
                      color: '#0891b2', 
                      border: '1px dashed #06b6d4', 
                      padding: '12px 14px', 
                      borderRadius: '12px', 
                      cursor: 'pointer', 
                      fontWeight: 'bold', 
                      fontSize: '13px', 
                      whiteSpace: 'nowrap', 
                      boxShadow: '0 2px 4px rgba(6,182,212,0.1)',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '4px'
                    }}
                  >
                    <span>➕</span> 新增客戶
                  </button>

                  <button 
                    onClick={() => setShowQuickCreateModal(true)} 
                    style={{ 
                      flex: '1 1 120px',
                      background: '#f0fdf4', 
                      color: '#16a34a', 
                      border: '1px dashed #22c55e', 
                      padding: '12px 14px', 
                      borderRadius: '12px', 
                      cursor: 'pointer', 
                      fontWeight: 'bold', 
                      fontSize: '13px', 
                      whiteSpace: 'nowrap', 
                      boxShadow: '0 2px 4px rgba(34,197,94,0.1)',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '4px'
                    }}
                    title="輸入簡易文字快速建立客戶帳戶與保單"
                  >
                    <span>⚡</span> 快速建立
                  </button>

                  {clients.length > 1 && (
                    <button 
                      onClick={() => setDeleteConfirm({ show: true, id: activeClientId, type: 'client' })}
                      style={{ 
                        flex: '1 1 120px',
                        background: '#fef2f2', 
                        color: '#ef4444', 
                        border: '1px solid #fca5a5', 
                        padding: '12px 14px', 
                        borderRadius: '12px', 
                        cursor: 'pointer', 
                        fontWeight: 'bold', 
                        fontSize: '13px', 
                        whiteSpace: 'nowrap',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        gap: '4px'
                      }}
                    >
                      <span>🗑️</span> 刪除此客戶
                    </button>
                  )}
                </div>

              </div>
            </div>

            <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignItems: 'center', gap: '12px', background: '#f8fafc', padding: '8px', borderRadius: '16px', border: '1px solid #e2e8f0', marginTop: '8px' }}>
              <button onClick={() => setActiveTab('dashboard')} style={{ background: activeTab === 'dashboard' ? '#ffffff' : 'transparent', color: activeTab === 'dashboard' ? '#2563eb' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'dashboard' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>📊 華麗報表預覽</button>
              <button onClick={() => setActiveTab('data')} style={{ background: activeTab === 'data' ? '#ffffff' : 'transparent', color: activeTab === 'data' ? '#ea580c' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'data' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>📝 數據編輯中心</button>
              <div style={{ width: '1px', background: '#cbd5e1', margin: '4px 8px', alignSelf: 'stretch' }}></div>
              <button onClick={() => setActiveTab('products')} style={{ background: activeTab === 'products' ? '#ffffff' : 'transparent', color: activeTab === 'products' ? '#9333ea' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'products' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>⚙️ 商品庫與備份</button>
            </div>
          </div>

          {/* ==================================================== 📦 商品庫與備份分頁 ==================================================== */}
          {activeTab === 'products' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px', width: '100%', maxWidth: '1400px' }}>
              
              {/* 🤖 貼上更新區塊 */}
              <div className="glass-card" style={{ padding: '32px', background: 'linear-gradient(135deg, #f8fafc 0%, #f5f3ff 100%)', border: '1px solid #ddd6fe', boxShadow: '0 10px 25px rgba(139,92,246,0.05)' }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '16px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                      <span style={{ fontSize: '32px' }}>⚡</span>
                      <div>
                        <h2 style={{ margin: 0, fontSize: '22px', color: '#0f172a', fontWeight: '900' }}>快速批次更新配息與單位數中心</h2>
                        <p style={{ fontSize: '14px', color: '#64748b', margin: '4px 0 0 0', lineHeight: '1.6' }}>
                          在此快速批次更新全體客戶的最新單位數與每月撥回配息！支援「單月份更新（情況一）」與「同一標的多月份配息同時更新（情況二）」。
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* 格式引導範例卡片 */}
                  <div className="bg-white p-4 rounded-xl border border-slate-200 text-xs text-slate-600 space-y-2">
                    <div className="font-bold text-slate-800 flex items-center gap-1">
                      <span>💡</span> 全新升級：格式中新增了<b>「客戶姓名」</b>與<b>「最新單位數」</b>兩大對帳關鍵資訊！
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <span className="font-bold text-blue-600">📌 情況一 (單月對帳配息更新)</span>
                        <p className="mt-1">格式：<code>保單號碼 , 客戶姓名 , 基金標的 , 最新基準日單位數 , 月份 , 配息金額 , 給付方式</code></p>
                      </div>
                      <div>
                        <span className="font-bold text-purple-600">📌 情況二 (同一標的，更新多月份配息)</span>
                        <p className="mt-1">格式：<code>保單號碼 , 客戶姓名 , 基金標的 , 最新基準日單位數 , [月份1] , [金額1] , [給付方式1] , [月份2] , [金額2]...</code></p>
                      </div>
                    </div>
                  </div>

                  {/* 批次更新主操作區 */}
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }} className="grid grid-cols-1 lg:grid-cols-2">
                    
                    {/* 左側：多行貼入區 */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }} className="bg-white/70 p-6 rounded-2xl border border-slate-200 backdrop-blur">
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        <label style={labelStyle}>📋 貼入多筆對帳與配息資料（支援多行輸入）</label>
                        <textarea
                          value={batchDividendInput}
                          onChange={e => setBatchDividendInput(e.target.value)}
                          placeholder="每一行請依循逗號隔開：&#10;48885 , 王小明 , 環球總報酬 , 1250.5 , 5月 , 2229 , 累積單位數&#10;33912 , 李大同 , 鑫穩健-A1 , 3500 , 5月 , 15000 , 現金給付 , 6月 , 15000 , 現金給付..."
                          style={{ ...inputStyle, height: '300px', resize: 'vertical', fontFamily: 'monospace', fontSize: '12px', background: '#ffffff', lineHeight: '1.6' }}
                        />
                      </div>
                      
                      <button 
                        onClick={() => handleParseBatchDividendInput(batchDividendInput)} 
                        disabled={!batchDividendInput.trim()}
                        style={{ width: '100%', background: !batchDividendInput.trim() ? '#cbd5e1' : 'linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%)', color: '#fff', border: 'none', padding: '14px', borderRadius: '12px', cursor: !batchDividendInput.trim() ? 'not-allowed' : 'pointer', fontWeight: 'bold', fontSize: '15px', boxShadow: !batchDividendInput.trim() ? 'none' : '0 4px 12px rgba(139,92,246,0.2)' }}
                      >
                        🔍 立即智慧比對保單並解析配息 (最新版)
                      </button>
                    </div>

                    {/* 右側：解析預覽與一鍵更新確認 */}
                    <div style={{ display: 'flex', flexDirection: 'column', border: '2px dashed #cbd5e1', borderRadius: '16px', padding: '20px', background: '#f8fafc', minHeight: '430px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #cbd5e1', paddingBottom: '12px', marginBottom: '16px' }}>
                        <span style={{ fontSize: '14px', color: '#475569', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '6px' }}>
                          📋 批次核對清單與手動配置修改區 (可直接編輯)
                        </span>
                        {parsedBatchUpdateRows.length > 0 && (
                          <span className="text-xs bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-bold">
                            共 {parsedBatchUpdateRows.length} 筆資料
                          </span>
                        )}
                      </div>

                      {parsedBatchUpdateRows.length > 0 ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', flex: 1 }}>
                          {/* 可編輯卡片容器 */}
                          <div className="overflow-y-auto max-h-[500px] space-y-4 pr-1">
                            {parsedBatchUpdateRows.map((row) => {
                              const selectedClient = clients.find(c => c.id === row.selectedClientId);
                              return (
                                <div 
                                  key={row.lineIndex} 
                                  className={`p-4 rounded-xl border-2 shadow-sm flex flex-col gap-3 transition-all bg-white ${
                                    row.status === 'success' 
                                      ? 'border-emerald-500/80 bg-emerald-50/10' 
                                      : row.status === 'warning'
                                      ? 'border-amber-400/80 bg-amber-50/10'
                                      : 'border-rose-500/80 bg-rose-50/10'
                                  }`}
                                >
                                  {/* 卡片標題與刪除行按鈕 */}
                                  <div className="flex justify-between items-center pb-2 border-b border-dashed border-slate-200">
                                    <span className="text-xs font-bold text-slate-700">
                                      第 {row.lineIndex} 行原始資訊：
                                    </span>
                                    <button 
                                      onClick={() => handleDeleteRow(row.lineIndex)}
                                      className="text-xs text-rose-600 hover:text-rose-800 font-bold px-2 py-1 rounded hover:bg-rose-50 transition"
                                      title="不匯入此行"
                                    >
                                      🗑️ 移除此行
                                    </button>
                                  </div>

                                  <div className="text-[10px] text-slate-400 font-mono truncate italic bg-slate-50 p-1.5 rounded">
                                    「{row.rawText}」
                                  </div>

                                  {/* 警告/成功指示訊息 */}
                                  <div className={`text-xs font-bold ${
                                    row.status === 'success' ? 'text-emerald-700' : row.status === 'warning' ? 'text-amber-700' : 'text-rose-700'
                                  }`}>
                                    {row.status === 'success' ? '✅ ' : row.status === 'warning' ? '⚠️ ' : '❌ '} {row.message}
                                  </div>

                                  {/* 1. 客戶與帳戶/保單對應修改選單 */}
                                  <div className="grid grid-cols-2 gap-2">
                                    <div>
                                      <label className="text-[11px] font-bold text-slate-500 block mb-1">對應客戶：</label>
                                      <select
                                        value={row.selectedClientId}
                                        onChange={e => handleRowClientChange(row.lineIndex, e.target.value)}
                                        style={{ ...selectStyle, padding: '6px 8px', fontSize: '12px' }}
                                        disabled={row.status === 'error' && row.message.includes('不存在')}
                                      >
                                        <option value="">-- 手動指定客戶 --</option>
                                        {clients.map(c => (
                                          <option key={c.id} value={c.id}>{c.clientName}</option>
                                        ))}
                                      </select>
                                    </div>
                                    <div>
                                      <label className="text-[11px] font-bold text-slate-500 block mb-1">對應標的保單：</label>
                                      <select
                                        value={row.selectedAccountId}
                                        onChange={e => handleRowAccountChange(row.lineIndex, e.target.value)}
                                        style={{ ...selectStyle, padding: '6px 8px', fontSize: '12px' }}
                                        disabled={!row.selectedClientId || (row.status === 'error' && row.message.includes('不存在'))}
                                      >
                                        <option value="">-- 選擇保單/基金 --</option>
                                        {selectedClient?.accounts?.map(acc => (
                                          <option key={acc.id} value={acc.id}>
                                            {acc.acc || '無保單號'} - {acc.name || '未選擇標的'}
                                          </option>
                                        ))}
                                      </select>
                                    </div>
                                  </div>

                                  {/* 2. 修改基準日單位數 */}
                                  <div className="bg-slate-50/50 p-2.5 rounded-lg border border-slate-200">
                                    <div className="flex items-center gap-2">
                                      <label className="text-xs font-bold text-slate-600 shrink-0">最新基準日單位數：</label>
                                      <input 
                                        type="number" 
                                        step="any"
                                        value={row.units} 
                                        onChange={e => handleRowUnitsChange(row.lineIndex, e.target.value)}
                                        style={{ ...inputStyle, padding: '4px 8px', fontSize: '12px', width: '120px' }}
                                        disabled={row.status === 'error' && row.message.includes('不存在')}
                                      />
                                    </div>
                                  </div>

                                  {/* 3. 修改每月撥回配息明細 */}
                                  <div>
                                    <div className="flex justify-between items-center mb-1">
                                      <span className="text-[11px] font-bold text-slate-500">配息明細修改：</span>
                                      <button 
                                        onClick={() => handleAddRowDividend(row.lineIndex)}
                                        className="text-[10px] text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded"
                                        disabled={row.status === 'error' && row.message.includes('不存在')}
                                      >
                                        ➕ 增加月份
                                      </button>
                                    </div>

                                    <div className="space-y-1.5">
                                      {row.dividends.map(div => (
                                        <div key={div.id} className="flex gap-1.5 items-center bg-slate-50 p-1.5 rounded border border-slate-100">
                                          <input 
                                            type="text" 
                                            value={div.month} 
                                            onChange={e => handleRowDividendChange(row.lineIndex, div.id, 'month', e.target.value)}
                                            style={{ ...inputStyle, padding: '3px 6px', fontSize: '11px', width: '60px' }} 
                                          />
                                          <input 
                                            type="number" 
                                            value={div.amount} 
                                            onChange={e => handleRowDividendChange(row.lineIndex, div.id, 'amount', e.target.value)}
                                            style={{ ...inputStyle, padding: '3px 6px', fontSize: '11px', flex: 1 }} 
                                            placeholder="配息金額"
                                          />
                                          <button
                                            onClick={() => handleRowDividendChange(row.lineIndex, div.id, 'type', div.type === '累積單位數' ? '現金給付' : '累積單位數')}
                                            className={`text-[10px] px-2 py-1 rounded font-bold shrink-0 transition ${
                                              div.type === '累積單位數' 
                                                ? 'bg-purple-100 text-purple-700 hover:bg-purple-200' 
                                                : 'bg-blue-100 text-blue-700 hover:bg-blue-200'
                                            }`}
                                          >
                                            {div.type === '累積單位數' ? '📈 單位' : '💵 現金'}
                                          </button>
                                          <button 
                                            onClick={() => handleDeleteRowDividend(row.lineIndex, div.id)}
                                            className="text-red-500 hover:text-red-700 shrink-0 text-xs px-1 font-bold"
                                            title="刪除此月"
                                          >
                                            ✕
                                          </button>
                                        </div>
                                      ))}
                                    </div>
                                  </div>

                                </div>
                              );
                            })}
                          </div>

                          {/* 警告與更新確認區 */}
                          {parsedBatchUpdateRows.some(r => r.status === 'error') && (
                            <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-semibold flex items-center gap-2">
                              <span>⚠️</span> 系統偵測到未註冊的保單，更新功能已鎖定。請修正資料庫，或移除錯誤資料卡片。
                            </div>
                          )}

                          <button 
                            onClick={handleApplyBatchDividendUpdates} 
                            disabled = {
                              parsedBatchUpdateRows.some(r => r.status === 'error') || 
                              !parsedBatchUpdateRows.some(r => r.selectedClientId && r.selectedAccountId)
                            }
                            style={{ 
                              width: '100%', 
                              marginTop: 'auto', 
                              background: (
                                parsedBatchUpdateRows.some(r => r.status === 'error') || 
                                !parsedBatchUpdateRows.some(r => r.selectedClientId && r.selectedAccountId)
                              ) ? '#cbd5e1' : '#059669', 
                              color: '#fff', 
                              border: 'none', 
                              padding: '14px', 
                              borderRadius: '12px', 
                              cursor: (
                                parsedBatchUpdateRows.some(r => r.status === 'error') || 
                                !parsedBatchUpdateRows.some(r => r.selectedClientId && r.selectedAccountId)
                              ) ? 'not-allowed' : 'pointer', 
                              fontWeight: 'bold', 
                              fontSize: '15px', 
                              transition: 'background 0.2s',
                              boxShadow: (
                                parsedBatchUpdateRows.some(r => r.status === 'error') || 
                                !parsedBatchUpdateRows.some(r => r.selectedClientId && r.selectedAccountId)
                              ) ? 'none' : '0 4px 10px rgba(5,150,105,0.15)'

              {/* 💾 系統資料備份與還原 (Checkpoint) */}

                    <p style={{ fontSize: '14px', color: '#64748b', margin: 0, lineHeight: '1.6', maxWidth: '600px' }}>在此將您的所有客戶資料、標的設定與自訂配色下載為一個備份檔。當您更換電腦、清理瀏覽器快取，或怕不小心把資料改壞時，可以隨時上傳這個檔案還原到先前的 Checkpoint 狀態。</p>

                              <option value="USD">US$</option>

                    </div>

                  <thead>
                    <tr style={{ background: '#f8fafc' }}>
                      <th style={{ padding: '12px', color: '#475569', fontSize: '13px', width: '100px', borderBottom: '2px solid #e2e8f0' }}>   月份 </th>
                      {accounts.map(acc => (
                        <th key={acc.id} style={{ padding: '16px', color: theme.accountColors[acc.id], fontSize: '14px', borderBottom: '2px solid #e2e8f0' }}>

                                    onClick={() => handleTypeChange(index, acc.id, isUnits ? '現金給付' : '累積單位數')}

                                      display: 'flex',
                                      alignItems: 'center',
                                      justifyContent: 'center',
                                      boxShadow: '0 2px 4px rgba(0,0,0,0.02)'

                                    {isUnits ? '📈 單位' : '💵 現金'}

                                </div>
                              </td>
                            );
                          })}
                          <td style={{ padding: '12px 16px', color: theme.lineTotal, fontWeight: '900', fontSize: '14px' }}>

                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', background: '#f8fafc', padding: '8px 16px', borderRadius: '12px', border: '1px solid #e2e8f0' }}>

                      {accounts.map(acc => (
                         <input key={acc.id} type="color" value={theme.accountColors[acc.id] || '#ffffff'} onChange={e => handleColorChange(acc.id, e.target.value)} style={{...colorInputStyle, border: '2px solid #fff', boxShadow: '0 2px 8px rgba(0,0,0,0.1)'}} title={acc.name} />

                      <div style={{width: '1px', height: '24px', background: '#cbd5e1', margin: '0 4px'}}></div>
                      <input type="color" value={theme.lineTotal} onChange={e => setTheme({...theme, lineTotal: e.target.value})} style={{...colorInputStyle, border: '2px solid #fff', boxShadow: '0 2px 8px rgba(0,0,0,0.1)'}} title="趨勢線與重點" />
                      <input type="color" value={theme.heroBg} onChange={e => setTheme({...theme, heroBg: e.target.value})} style={{...colorInputStyle, border: '2px solid #fff', boxShadow: '0 2px 8px rgba(0,0,0,0.1)'}} title="頂層卡片主色" />
                    </div>
                    <button onClick={handleRandomizeColors} style={{ background: '#f1f5f9', color: '#334155', border: '1px solid #e2e8f0', padding: '10px 16px', borderRadius: '12px', fontSize: '13px', cursor: 'pointer', whiteSpace: 'nowrap', fontWeight: '800', boxShadow: '0 2px 5px rgba(0,0,0,0.02)' }}>🎲 靈感調色</button>
                  </div>

                        setOriginalClientIdBeforeBatch(activeClientId);
                        setIsSaving(true);

                        background: isSaving ? '#cbd5e1' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',

                        padding: '12px 28px', 
                        borderRadius: '14px', 
                        fontWeight: '900', 
                        boxShadow: isSaving ? 'none' : '0 10px 25px rgba(118, 75, 162, 0.3), inset 0 2px 4px rgba(255,255,255,0.4)',

                        whiteSpace: 'nowrap', 
                        fontSize: '15px', 
                        textShadow: '0 1px 2px rgba(0,0,0,0.1)',
