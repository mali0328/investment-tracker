<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投資績效追蹤系統 (華麗旗艦版)</title>
  
  <!-- 1. 載入 React 核心 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- 2. 載入 PropTypes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  
  <!-- 3. 載入 Recharts 圖表庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/1.8.5/Recharts.min.js"></script>

  <!-- 4. 載入 Babel 編譯 JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

  <!-- 5. 載入 html2canvas 用於截圖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 6. 💡 載入 JSZip 用於全體客戶報表一鍵壓縮打包下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body { 
      margin: 0; 
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: radial-gradient(circle at top right, #fdfbfb 0%, #ebedee 100%);
      color: #334155;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box;}
    input[type="month"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.04), 0 5px 15px rgba(0,0,0,0.02);
      border-radius: 20px;
    }

    /* 截圖導出時的特別樣式：強制隱藏編輯輔助虛線，避免產生黑影或虛擬框線 */
    .html2canvas-container [contenteditable] {
      border-bottom: 1px dashed transparent !important;
      outline: none !important;
    }
    .html2canvas-container .no-capture {
      display: none !important;
    }

    /* 高級提示框下滑動畫 */
    @keyframes slideDown {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    const RechartsLib = window.Recharts || {};
    const { ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = RechartsLib;

    const C = {
      navy:  "#0f172a",   
      blue:  "#2563eb",   
      white: "#ffffff",
      gray:  "#64748b",   
      light: "#f8fafc",   
      gold:  "#f59e0b",
    };

    function Counter({ target, prefix = '', suffix = '', duration = 1400 }) {
      const [count, setCount] = useState(0);
      useEffect(() => {
        let startTime;
        let animationFrame;
        const animate = (time) => {
          if (!startTime) startTime = time;
          const progress = Math.min((time - startTime) / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          setCount(Math.floor(easeOut * target));
          if (progress < 1) animationFrame = requestAnimationFrame(animate);
          else setCount(target);
        };
        animationFrame = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(animationFrame);
      }, [target, duration]);
      return <span>{prefix}{count.toLocaleString('en-US')}{suffix}</span>;
    }

    const EditableTitle = ({ value, onSave, style, hoverBorder="1px dashed #94a3b8" }) => (
      <span
        contentEditable
        suppressContentEditableWarning
        onBlur={e => onSave(e.currentTarget.innerText)}
        onMouseEnter={e => e.currentTarget.style.borderBottom = hoverBorder}
        onMouseLeave={e => e.currentTarget.style.borderBottom = '1px dashed transparent'}
        style={{ cursor: 'text', borderBottom: '1px dashed transparent', outline: 'none', transition: 'border 0.2s', display: 'inline-block', minWidth: '30px', ...style }}
        title="點擊修改文字"
      >
        {value}
      </span>
    );

    const defaultProducts = [
      { id: 'P1', name: '鑫穩健-A1', currency: 'TWD' },
      { id: 'P2', name: 'e指標-A1', currency: 'TWD' },
      { id: 'P3', name: '環球總報酬', currency: 'TWD' }
    ];

    const defaultClientState = {
      clientName: "新客戶",
      reportTitle: "115 年度 投資配息與再投入績效追蹤",
      fontScales: { global: 1, header: 1, kpi: 1, chart: 1, table: 1, events: 1 },
      accounts: [
        { id: 'A1', name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' },
        { id: 'A2', name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' }
      ],
      theme: {
        accountColors: { A1: "#2563eb", A2: "#0891b2" },
        lineTotal: "#f59e0b", heroBg: "#1e293b"
      },
      rawMonthlyData: [
        { month: '1月', A1: 0, A2: 0 }, { month: '2月', A1: 0, A2: 0 },
        { month: '3月', A1: 0, A2: 0 }, { month: '4月', A1: 0, A2: 0 },
        { month: '5月', A1: 0, A2: 0 }, { month: '6月', A1: 0, A2: 0 },
        { month: '7月', A1: 0, A2: 0 }, { month: '8月', A1: 0, A2: 0 },
        { month: '9月', A1: 0, A2: 0 }, { month: '10月', A1: 0, A2: 0 },
        { month: '11月', A1: 0, A2: 0 }, { month: '12月', A1: 0, A2: 0 }
      ],
      eventRecords: []
    };

    function App() {
      const [activeTab, setActiveTab] = useState('data'); 
      const [isSaving, setIsSaving] = useState(false);
      const [savedImage, setSavedImage] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState({ show: false, id: null, type: '' });
      
      // 自訂背景圖片與磨砂玻璃不透明度控制
      const [bgImage, setBgImage] = useState(null);
      const [bgOpacity, setBgOpacity] = useState(0.85); // 預設 85% 輕透度

      // 姓氏搜尋字串
      const [searchSurname, setSearchSurname] = useState("");

      // 全域 Toast 提示狀態，取代傳統 alert()
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
      };
      
      // 💡 批量下載全體報表專用狀態機
      const [batchIndex, setBatchIndex] = useState(-1); // -1 代表未運行運行，>= 0 代表目前捕捉第幾個客戶
      const [batchSavedImages, setBatchSavedImages] = useState([]); // 暫存捕捉完的 Base64 數據
      const [originalClientIdBeforeBatch, setOriginalClientIdBeforeBatch] = useState(null); // 下載結束後切換回原本選定的客戶

      const [savedThemes, setSavedThemes] = useState(() => {
        try { const local = localStorage.getItem('investment_color_themes_v6'); return local ? JSON.parse(local) : []; } catch (e) { return []; }
      });
      const [isNamingTheme, setIsNamingTheme] = useState(false);
      const [themeNameInput, setThemeNameInput] = useState("");

      const [products, setProducts] = useState(() => {
        try { const local = localStorage.getItem('investment_crm_products_v2'); if (local) return JSON.parse(local); } catch (e) {}
        return defaultProducts;
      });
      useEffect(() => { localStorage.setItem('investment_crm_products_v2', JSON.stringify(products)); }, [products]);

      const [clients, setClients] = useState(() => {
        try { const local = localStorage.getItem('investment_crm_clients_v3'); if (local) return JSON.parse(local); } catch (e) {}
        return [{ id: `C${Date.now()}`, ...defaultClientState }];
      });
      const [activeClientId, setActiveClientId] = useState(clients[0]?.id);
      useEffect(() => { localStorage.setItem('investment_crm_clients_v3', JSON.stringify(clients)); }, [clients]);

      // 💡 重寫 ActiveClient：若正處於一鍵打包背景下載狀態，則由 batchIndex 動態覆蓋渲染對象，實現流暢的背景離屏繪製
      const activeClient = batchIndex !== -1 
        ? (clients[batchIndex] || clients[0]) 
        : (clients.find(c => c.id === activeClientId) || clients[0]);

      const updateActiveClientField = (field, valueOrUpdater) => {
        setClients(prevClients => prevClients.map(c => {
          if (c.id !== activeClientId) return c;
          const newValue = typeof valueOrUpdater === 'function' ? valueOrUpdater(c[field]) : valueOrUpdater;
          return { ...c, [field]: newValue };
        }));
      };

      const clientName = activeClient.clientName;
      const setClientName = (v) => updateActiveClientField('clientName', v);
      const reportTitle = activeClient.reportTitle || "115 年度 投資配息與再投入績效追蹤";
      const setReportTitle = (v) => updateActiveClientField('reportTitle', v);
      const accounts = activeClient.accounts;
      const setAccounts = (v) => updateActiveClientField('accounts', v);
      const theme = activeClient.theme;
      const setTheme = (v) => updateActiveClientField('theme', v);
      const rawMonthlyData = activeClient.rawMonthlyData;
      const setRawMonthlyData = (v) => updateActiveClientField('rawMonthlyData', v);
      const eventRecords = activeClient.eventRecords;
      const setEventRecords = (v) => updateActiveClientField('eventRecords', v);

      const getTitle = (key, defaultStr) => activeClient.dashboardTitles?.[key] !== undefined ? activeClient.dashboardTitles[key] : defaultStr;
      const updateTitle = (key, val) => setClients(prev => prev.map(c => c.id === activeClientId ? { ...c, dashboardTitles: { ...(c.dashboardTitles || {}), [key]: val } } : c));

      const updateScale = (key, delta) => {
        setClients(prev => prev.map(c => {
          if (c.id !== activeClientId) return c;
          const currentScales = c.fontScales || { global: 1, header: 1, kpi: 1, chart: 1, table: 1, events: 1 };
          const newVal = Math.min(3, Math.max(0.4, (currentScales[key] || 1) + delta));
          return { ...c, fontScales: { ...currentScales, [key]: newVal } };
        }));
      };

      const fontScales = activeClient.fontScales || { global: 1, header: 1, kpi: 1, chart: 1, table: 1, events: 1 };
      const sGlobal = fontScales.global || 1;
      const sHeader = sGlobal * (fontScales.header || 1);
      const sKpi    = sGlobal * (fontScales.kpi || 1);
      const sChart  = sGlobal * (fontScales.chart || 1);
      const sTable  = sGlobal * (fontScales.table || 1);
      const sEvents = sGlobal * (fontScales.events || 1);

      const [colScales, setColScales] = useState({ policy: 1, date: 1, name: 1, unit: 1, invest: 1, monthly: 1 });
      const updateColScale = (key, delta) => setColScales(prev => ({ ...prev, [key]: Math.min(3, Math.max(0.4, prev[key] + delta)) }));
      
      const ScaleButtons = ({ scaleKey }) => (
        !isSaving ? (
          <div className="no-capture" style={{ display: 'inline-flex', background: '#f1f5f9', borderRadius: '6px', overflow: 'hidden', flexShrink: 0, marginLeft: '6px', boxShadow: 'inset 0 1px 2px rgba(0,0,0,0.05)' }}>
            <button onClick={() => updateColScale(scaleKey, -0.1)} style={{ background: 'transparent', border: 'none', padding: '2px 8px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold', color: C.gray }} title="縮小">-</button>
            <button onClick={() => updateColScale(scaleKey, 0.1)} style={{ background: 'transparent', border: 'none', padding: '2px 8px', cursor: 'pointer', fontSize: '12px', fontWeight: 'bold', color: C.gray }} title="放大">+</button>
          </div>
        ) : null
      );

      const ScaleControl = ({ label, scaleKey }) => {
        const val = fontScales[scaleKey] || 1;
        return (
          <div style={{ display: 'flex', alignItems: 'center', background: '#ffffff', borderRadius: '8px', border: '1px solid #e2e8f0', boxShadow: '0 2px 4px rgba(0,0,0,0.02)', overflow: 'hidden', flexShrink: 0 }}>
            <span style={{ padding: '6px 10px', fontSize: '12px', color: '#64748b', borderRight: '1px solid #e2e8f0', background: '#f8fafc', whiteSpace: 'nowrap', fontWeight: 'bold' }}>{label}</span>
            <button onClick={() => updateScale(scaleKey, -0.05)} style={{ background: 'transparent', color: '#334155', border: 'none', cursor: 'pointer', padding: '6px 10px', fontSize: '14px', fontWeight: 'bold' }}>-</button>
            <span style={{ color: '#2563eb', fontSize: '12px', fontWeight: '900', minWidth: '42px', textAlign: 'center' }}>{Math.round(val * 100)}%</span>
            <button onClick={() => updateScale(scaleKey, 0.05)} style={{ background: 'transparent', color: '#334155', border: 'none', cursor: 'pointer', padding: '6px 10px', fontSize: '14px', fontWeight: 'bold' }}>+</button>
          </div>
        );
      };

      const getSym = (curr) => curr === 'USD' ? 'US$' : 'NT$';
      const globalSym = (() => { const currs = [...new Set(accounts.map(a => a.currency || 'TWD'))]; return currs.length === 1 ? getSym(currs[0]) : '$'; })();
      const parseAmount = (val) => { if (!val) return 0; const num = Number(String(val).replace(/[^0-9.-]+/g, "")); return isNaN(num) ? 0 : num; };

      const accountTotals = accounts.map(acc => {
        const eventSum = eventRecords.filter(e => e.target === acc.id).reduce((s, e) => s + parseAmount(e.amount), 0);
        const totalInvest = Number(acc.invest) + eventSum;
        const totalDividend = rawMonthlyData.reduce((s, d) => s + (Number(d[acc.id]) || 0), 0);
        return { ...acc, eventSum, totalInvest, totalDividend };
      });
      const finalTotal = accountTotals.reduce((s, acc) => s + acc.totalDividend, 0);

      // 動態彙整保單基本資料
      const groupedByPolicy = [];
      const policyMap = {};
      accountTotals.forEach(acc => {
        const pKey = (acc.acc || '').trim() || acc.id; 
        if (!policyMap[pKey]) {
          policyMap[pKey] = { 
            key: pKey, 
            policyNo: (acc.acc || '').trim() || '未命名保單', 
            policyDate: acc.policyDate || '', 
            names: [acc.name || '未選擇標的'], 
            totalDividend: 0, 
            totalInvest: 0, 
            currency: acc.currency, 
            color: theme.accountColors[acc.id] || '#2563eb', 
            accounts: [] 
          };
          groupedByPolicy.push(policyMap[pKey]);
        } else {
          policyMap[pKey].names.push(acc.name || '未選擇標的');
        }
        policyMap[pKey].accounts.push(acc);
        policyMap[pKey].totalDividend += acc.totalDividend;
        policyMap[pKey].totalInvest += acc.totalInvest;
        if (policyMap[pKey].currency !== acc.currency) policyMap[pKey].currency = 'MIXED';
      });

      // 設定動態磨砂玻璃卡片背景與柔和陰影樣式
      const cardStyle = {
        background: bgImage ? `rgba(255, 255, 255, ${bgOpacity})` : '#ffffff',
        borderRadius: '24px',
        padding: '24px',
        boxShadow: bgImage ? '0 10px 30px rgba(0,0,0,0.06)' : '0 20px 40px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.02)',
        border: bgImage ? '1px solid rgba(255,255,255,0.4)' : '1px solid #f1f5f9',
        display: 'flex',
        flexDirection: 'column',
        transition: 'all 0.3s ease',
        backdropFilter: bgImage ? 'blur(10px)' : 'none',
      };

      // 建立每張保單的獨立歷史累加器
      const policyCumSums = {};
      groupedByPolicy.forEach(group => {
        policyCumSums[group.key] = 0;
      });

      // 動態偵測最後一個有實際輸入數據的月份索引
      let lastActiveIndex = -1;
      rawMonthlyData.forEach((row, idx) => {
        let hasData = false;
        accounts.forEach(acc => {
          const val = Number(row[acc.id]) || 0;
          if (val > 0) {
            hasData = true;
          }
        });
        if (hasData) {
          lastActiveIndex = idx;
        }
      });
      if (lastActiveIndex === -1) {
        lastActiveIndex = 0;
      }

      let currentCum = 0;
      const monthlyData = rawMonthlyData.map((d, idx) => {
        let sumThisMonth = 0;
        const newD = { month: d.month };
        
        // 先計算該月份各個保單的單月總和
        const groupSumsThisMonth = {};
        groupedByPolicy.forEach(group => {
          let groupSumThisMonth = 0;
          group.accounts.forEach(acc => {
            const val = Number(d[acc.id]) || 0;
            sumThisMonth += val;
            groupSumThisMonth += val;
            newD[acc.id] = val; 
          });
          groupSumsThisMonth[group.key] = groupSumThisMonth;
        });

        currentCum += sumThisMonth;

        // 核心關鍵：若當前月份小於或等於最後有數據的月份，則傳入累積高度供圖表繪製；若大於，則設為 null
        groupedByPolicy.forEach(group => {
          policyCumSums[group.key] += groupSumsThisMonth[group.key];
          if (idx <= lastActiveIndex) {
            newD[`policy_${group.key}`] = policyCumSums[group.key];
          } else {
            newD[`policy_${group.key}`] = null; 
          }
        });

        if (idx <= lastActiveIndex) {
          newD.TotalCum = currentCum;
        } else {
          newD.TotalCum = null; 
        }
        
        newD.monthlyTotal = sumThisMonth;     
        return newD;
      });

      // 累計現金給付與累計單位數之加總
      let totalCash = 0; 
      let totalUnits = 0; 
      rawMonthlyData.forEach(row => {
        accounts.forEach(acc => {
          const amount = Number(row[acc.id]) || 0;
          const type = row[`${acc.id}_type`] || '現金給付';
          if (type === '現金給付') {
            totalCash += amount;
          } else if (type === '累積單位數') {
            totalUnits += amount;
          }
        });
      });

      // 搜尋篩選後的客戶名單邏輯
      const filteredClients = clients.filter(c => {
        if (!searchSurname.trim()) return true;
        return c.clientName.trim().includes(searchSurname.trim());
      });

      const handleAddProduct = () => setProducts([...products, { id: `P${Date.now()}`, name: `新標的 ${products.length + 1}`, currency: 'TWD' }]);
      const handleUpdateProduct = (id, field, value) => setProducts(products.map(p => p.id === id ? { ...p, [field]: value } : p));
      const handleAddClient = () => { const newId = `C${Date.now()}`; setClients([...clients, { ...JSON.parse(JSON.stringify(defaultClientState)), id: newId, clientName: `新客戶 ${clients.length + 1}` }]); setActiveClientId(newId); };
      const handleAddAccount = () => { const newId = `A${Date.now()}`; setAccounts(prev => [...prev, { id: newId, name: '', acc: '', policyDate: '', invest: 0, units: 0, currency: 'TWD' }]); setTheme(prev => ({ ...prev, accountColors: { ...prev.accountColors, [newId]: getRandomColor() } })); setRawMonthlyData(rawMonthlyData.map(d => ({ ...d, [newId]: 0 }))); };
      const handleAccountChange = (id, field, value) => setAccounts(prev => prev.map(a => a.id === id ? { ...a, [field]: value } : a));
      const handleDataChange = (i, accountId, v) => setRawMonthlyData(prev => { const nd = [...prev]; nd[i] = { ...nd[i], [accountId]: v === '' ? '' : Number(v) }; return nd; }); 
      const handleTypeChange = (i, accountId, v) => setRawMonthlyData(prev => { const nd = [...prev]; nd[i] = { ...nd[i], [`${accountId}_type`]: v }; return nd; });
      const handleUpdateEvent = (id, f, v) => setEventRecords(prev => prev.map(e => e.id === id ? { ...e, [f]: v } : e));
      const handleRemoveEvent = (id) => setEventRecords(prev => prev.filter(e => e.id !== id));
      const handleAddEvent = () => setEventRecords(prev => [...prev, { id: Date.now(), icon: '💰', date: '', amount: '0', target: accounts[0]?.id || '', currency: 'TWD' }]);
      
      const handleBgUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setBgImage(event.target.result);
        };
        reader.readAsDataURL(file);
      };

      const confirmDeleteAction = () => {
        if (deleteConfirm.type === 'event') handleRemoveEvent(deleteConfirm.id);
        else if (deleteConfirm.type === 'theme') { const nt = savedThemes.filter(t => t.id !== deleteConfirm.id); setSavedThemes(nt); localStorage.setItem('investment_color_themes_v6', JSON.stringify(nt)); }
        else if (deleteConfirm.type === 'account') setAccounts(accounts.filter(a => a.id !== deleteConfirm.id));
        else if (deleteConfirm.type === 'month') setRawMonthlyData(rawMonthlyData.filter((_, i) => i !== deleteConfirm.id));
        else if (deleteConfirm.type === 'client') { 
          const newClients = clients.filter(c => c.id !== deleteConfirm.id); 
          setClients(newClients); 
          if (activeClientId === deleteConfirm.id) setActiveClientId(newClients[0].id); 
        }
        else if (deleteConfirm.type === 'product') setProducts(products.filter(p => p.id !== deleteConfirm.id));
        setDeleteConfirm({ show: false, id: null, type: '' });
      };

      const handleRandomizeColors = () => { const newColors = {}; accounts.forEach(acc => newColors[acc.id] = getRandomColor()); setTheme({ accountColors: newColors, lineTotal: getRandomColor(), heroBg: getRandomColor() }); };
      const getRandomColor = () => { const l = '3456789ABCDEF'; let c = '#'; for (let i = 0; i < 6; i++) c += l[Math.floor(Math.random() * 13)]; return c; };
      const handleColorChange = (accId, color) => setTheme(prev => ({ ...prev, accountColors: { ...prev.accountColors, [accId]: color } }));
      const confirmSaveTheme = () => { const name = themeNameInput.trim() || `配色 ${savedThemes.length + 1}`; const nt = [...savedThemes, { id: Date.now(), name, colors: { ...theme } }]; setSavedThemes(nt); localStorage.setItem('investment_color_themes_v6', JSON.stringify(nt)); setIsNamingTheme(false); setThemeNameInput(""); };

      const reportRef = useRef(null);
      
      const handleSaveImage = () => {
        if (activeTab !== 'dashboard') return;
        setIsSaving(true);
        
        if (!window.html2canvas) {
          showToast('系統未載入截圖套件，請檢查網路狀態。', 'error');
          setIsSaving(false);
          return;
        }

        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }

        setTimeout(() => {
          const element = reportRef.current;
          if (!element) {
            setIsSaving(false);
            return;
          }

          window.html2canvas(element, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: null, 
            logging: false,
            onclone: (clonedDoc) => {
              const target = clonedDoc.querySelector('[ref="reportRef"]') || clonedDoc.body;
              target.classList.add('html2canvas-container');
            }
          }).then(cvs => {
            setSavedImage(cvs.toDataURL('image/jpeg', 0.95));
            setIsSaving(false);
          }).catch(e => {
            console.error("截圖錯誤:", e);
            showToast('圖片生成失敗，可能是因為裝置記憶體不足。', 'error');
            setIsSaving(false);
          });
        }, 500);
      };

      // 💡 異步批量捕捉與 ZIP 打包下載機制
      useEffect(() => {
        if (batchIndex === -1) return;

        const runCapturePass = () => {
          // 延長等待時間至 900ms，確保 Recharts 折線與柱狀圖累積數據完全重新渲染並停止動畫
          const timer = setTimeout(() => {
            const element = reportRef.current;
            if (!element) {
              handleNextBatchSkip();
              return;
            }

            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }

            window.html2canvas(element, {
              scale: 2,
              useCORS: true,
              backgroundColor: null,
              logging: false,
              onclone: (clonedDoc) => {
                const target = clonedDoc.querySelector('[ref="reportRef"]') || clonedDoc.body;
                target.classList.add('html2canvas-container');
              }
            }).then(cvs => {
              const dataUrl = cvs.toDataURL('image/jpeg', 0.95);
              const currentClient = clients[batchIndex];

              setBatchSavedImages(prev => {
                const nextList = [...prev, { 
                  name: currentClient.clientName || `客戶_${batchIndex + 1}`, 
                  dataUrl 
                }];

                // 如果已經是最後一位客戶，直接觸發 ZIP 生成
                if (batchIndex === clients.length - 1) {
                  triggerZipPackingAndDownload(nextList);
                } else {
                  // 切換到下一位客戶進行渲染
                  setBatchIndex(prevIdx => prevIdx + 1);
                }
                return nextList;
              });
            }).catch(e => {
              console.error("批量截圖錯誤, 索引：", batchIndex, e);
              handleNextBatchSkip();
            });
          }, 900);

          return () => clearTimeout(timer);
        };

        const handleNextBatchSkip = () => {
          if (batchIndex === clients.length - 1) {
            triggerZipPackingAndDownload(batchSavedImages);
          } else {
            setBatchIndex(prevIdx => prevIdx + 1);
          }
        };

        return runCapturePass();
      }, [batchIndex]);

      // 💡 建立 ZIP 並觸發本地下載
      const triggerZipPackingAndDownload = (images) => {
        if (!window.JSZip) {
          showToast('無法載入壓縮套件，匯出失敗。', 'error');
          resetBatchState();
          return;
        }

        const zip = new JSZip();
        const usedNames = {};

        images.forEach((img) => {
          // 安全處理非法檔案路徑與命名字元，轉為底線相容
          let safeName = (img.name || '').trim().replace(/[/\\?%*:|"<>. ]/g, '_');
          if (!safeName) safeName = '未命名客戶';

          // 檔名重複時追加流水號
          if (usedNames[safeName] !== undefined) {
            usedNames[safeName] += 1;
            safeName = `${safeName}_${usedNames[safeName]}`;
          } else {
            usedNames[safeName] = 0;
          }

          // 去除 data:image/jpeg;base64, 標頭，提取純 Base64
          const base64Data = img.dataUrl.split(',')[1];
          zip.file(`${safeName}.jpg`, base64Data, { base64: true });
        });

        zip.generateAsync({ type: 'blob' }).then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
          a.download = `全體客戶投資報表打包_${dateStr}.zip`;
          a.click();
          URL.revokeObjectURL(url);

          showToast(`✨ 成功匯出 ${images.length} 位客戶高清報表！`, 'success');
          resetBatchState();
        }).catch(err => {
          console.error("ZIP 壓縮出錯：", err);
          showToast('壓縮打包時發生未知錯誤！', 'error');
          resetBatchState();
        });
      };

      const resetBatchState = () => {
        setIsSaving(false);
        setBatchIndex(-1);
        setBatchSavedImages([]);
        if (originalClientIdBeforeBatch) {
          setActiveClientId(originalClientIdBeforeBatch);
        }
      };

      const handleImportData = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.clients) { setClients(data.clients); setActiveClientId(data.clients[0]?.id); }
            if (data.products) setProducts(data.products);
            if (data.savedThemes) setSavedThemes(data.savedThemes);
            showToast('✅ 資料還原成功！', 'success');
          } catch (err) {
            showToast('❌ 檔案格式錯誤，請確認您上傳的是正確的 .json 備份檔！', 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleExportData = () => {
        const backupData = {
          exportDate: new Date().toLocaleString('zh-TW'),
          clients: clients,
          products: products,
          savedThemes: savedThemes
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
        a.download = `投資系統備份_${dateStr}.json`;
        a.click();
      };

      const inputStyle = { background: '#f8fafc', border: '1px solid #cbd5e1', color: '#1e293b', padding: '10px 12px', borderRadius: '8px', outline: 'none', width: '100%', boxSizing: 'border-box', boxShadow: 'inset 0 1px 3px rgba(0,0,0,0.02)', fontWeight: '500', transition: 'border 0.2s' };
      const selectStyle = { ...inputStyle, cursor: 'pointer', appearance: 'none', backgroundImage: 'url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E")', backgroundRepeat: 'no-repeat', backgroundPosition: 'right .7rem top 50%', backgroundSize: '.65rem auto' };
      const labelStyle = { display: 'block', fontSize: '13px', color: '#475569', marginBottom: '8px', fontWeight: 'bold' };
      const colorInputStyle = { width: '32px', height: '32px', padding: 0, border: 'none', borderRadius: '50%', cursor: 'pointer', overflow: 'hidden', flexShrink: 0 };

      if (!activeClient) return null;

      if (activeTab === 'dashboard' && (!window.Recharts || !ComposedChart)) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
            <div style={{ background: '#ffffff', padding: '40px', borderRadius: '24px', boxShadow: '0 20px 40px rgba(0,0,0,0.1)', textAlign: 'center', maxWidth: '500px' }}>
              <div style={{ fontSize: '48px', marginBottom: '16px' }}>⚠️</div>
              <h2 style={{ color: '#ef4444', margin: '0 0 16px 0', fontSize: '24px', fontWeight: '900' }}>系統檢測到圖表加載異常</h2>
              <p style={{ color: '#475569', lineHeight: '1.6', marginBottom: '24px' }}>這可能是原因為您的網路連線不穩，或是瀏覽器安全性阻擋了圖表核心模組的下載。請重新整理頁面，如果問題持續，建議使用 <b>Google Chrome</b> 開享此檔案。</p>
              <button onClick={() => setActiveTab('data')} style={{ background: '#3b82f6', color: '#fff', border: 'none', padding: '12px 24px', borderRadius: '12px', cursor: 'pointer', fontWeight: 'bold', fontSize: '16px', boxShadow: '0 4px 12px rgba(59,130,246,0.3)' }}>返回編輯數據</button>
            </div>
          </div>
        );
      }

      return (
        /* 💡 修正一：將最外層容器設為 Flexbox，水平與垂直在寬螢幕下完美居中對齊，解決畫面偏左問題 */
        <div style={{ 
          minHeight: '100vh', 
          padding: '24px', 
          boxSizing: 'border-box', 
          overflowX: 'hidden',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'flex-start',
          width: '100%'
        }}>
          {/* 💡 修正：將最大寬度(maxWidth)從 1240px 擴展至 1400px，大幅縮減寬螢幕左右不必要的留白，使版面最大化利用 */}
          <div style={{ maxWidth: '1400px', margin: '0 auto', width: '100%', display: 'flex', flexDirection: 'column', gap: '24px' }}>
            
            {/* 頂部 CRM 客戶切換與主要分頁導航 (已完全移除「常用姓氏」快捷標籤列) */}
            <div className="glass-card" style={{ display: 'flex', flexDirection: 'column', gap: '16px', padding: '24px', border: 'none', background: '#ffffff', boxShadow: '0 10px 30px rgba(0,0,0,0.04)' }}>
              
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', alignItems: 'end' }}>
                
                {/* 1. 搜尋姓氏/名稱欄位 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <label style={{ fontSize: '13px', color: '#475569', fontWeight: 'bold', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    🔍 1. 搜尋姓氏或名稱
                  </label>
                  <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                    <input 
                      type="text" 
                      value={searchSurname} 
                      onChange={e => setSearchSurname(e.target.value)} 
                      placeholder="輸入姓氏篩選 (例如: 馬)..." 
                      style={{ ...inputStyle, padding: '11px 14px', background: '#f8fafc' }}
                    />
                    {searchSurname && (
                      <button 
                        onClick={() => setSearchSurname("")} 
                        style={{ background: '#cbd5e1', border: 'none', color: '#334155', padding: '11px 14px', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold', fontSize: '13px' }}
                      >
                        清除
                      </button>
                    )}
                  </div>
                </div>

                {/* 2. 選擇完整名稱下拉選單 */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <label style={{ fontSize: '13px', color: '#475569', fontWeight: 'bold' }}>
                    👥 2. 選擇客戶完整名稱 ({filteredClients.length} 筆資料)
                  </label>
                  <select
                    value={filteredClients.some(c => c.id === activeClientId) ? activeClientId : ""}
                    onChange={e => {
                      if (e.target.value) {
                        setActiveClientId(e.target.value);
                      }
                    }}
                    style={{ ...selectStyle, padding: '11px 14px', background: '#f8fafc', color: '#0f172a', fontWeight: 'bold' }}
                  >
                    <option value="" disabled>
                      {filteredClients.length > 0 ? "-- 請選擇選單中的客戶 --" : "-- 無符合搜尋結果的客戶 --"}
                    </option>
                    {filteredClients.map(c => (
                      <option key={c.id} value={c.id}>
                        👤 {c.clientName}
                      </option>
                    ))}
                  </select>
                </div>

                {/* 3. 快速操作管理區 */}
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button 
                    onClick={handleAddClient} 
                    style={{ 
                      flex: 1,
                      background: '#f0fdfa', 
                      color: '#0891b2', 
                      border: '1px dashed #06b6d4', 
                      padding: '12px 18px', 
                      borderRadius: '12px', 
                      cursor: 'pointer', 
                      fontWeight: 'bold', 
                      fontSize: '14px', 
                      whiteSpace: 'nowrap', 
                      boxShadow: '0 2px 4px rgba(6,182,212,0.1)',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      gap: '6px'
                    }}
                  >
                    <span>➕</span> 新增客戶
                  </button>
                  {clients.length > 1 && (
                    <button 
                      onClick={() => setDeleteConfirm({ show: true, id: activeClientId, type: 'client' })}
                      style={{ 
                        flex: 1,
                        background: '#fef2f2', 
                        color: '#ef4444', 
                        border: '1px solid #fca5a5', 
                        padding: '12px 18px', 
                        borderRadius: '12px', 
                        cursor: 'pointer', 
                        fontWeight: 'bold', 
                        fontSize: '14px', 
                        whiteSpace: 'nowrap',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        gap: '6px'
                      }}
                    >
                      <span>🗑️</span> 刪除此客戶
                    </button>
                  )}
                </div>

              </div>
            </div>

            <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', alignItems: 'center', gap: '12px', background: '#f8fafc', padding: '8px', borderRadius: '16px', border: '1px solid #e2e8f0', marginTop: '8px' }}>
              <button onClick={() => setActiveTab('dashboard')} style={{ background: activeTab === 'dashboard' ? '#ffffff' : 'transparent', color: activeTab === 'dashboard' ? '#2563eb' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'dashboard' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>📊 華麗報表預覽</button>
              <button onClick={() => setActiveTab('data')} style={{ background: activeTab === 'data' ? '#ffffff' : 'transparent', color: activeTab === 'data' ? '#ea580c' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'data' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>📝 數據編輯中心</button>
              <div style={{ width: '1px', background: '#cbd5e1', margin: '4px 8px', alignSelf: 'stretch' }}></div>
              <button onClick={() => setActiveTab('products')} style={{ background: activeTab === 'products' ? '#ffffff' : 'transparent', color: activeTab === 'products' ? '#9333ea' : '#64748b', padding: '12px 28px', borderRadius: '12px', border: 'none', fontWeight: '800', cursor: 'pointer', fontSize: '15px', boxShadow: activeTab === 'products' ? '0 4px 12px rgba(0,0,0,0.05)' : 'none', transition: 'all 0.3s' }}>⚙️ 商品庫與備份</button>
            </div>
          </div>

          {/* ==================================================== 📦 商品庫與備份分頁 ==================================================== */}
          {activeTab === 'products' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px', width: '100%', maxWidth: '1240px' }}>
              
              {/* 系統資料備份與還原 */}
              <div className="glass-card" style={{ padding: '32px', background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)', border: '2px dashed #cbd5e1' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
                  <div>
                    <h2 style={{ margin: '0 0 12px 0', fontSize: '22px', color: '#0f172a', fontWeight: '900' }}>💾 系統資料備份與還原 (Checkpoint)</h2>
                    <p style={{ fontSize: '14px', color: '#64748b', margin: 0, lineHeight: '1.6', maxWidth: '600px' }}>在此將您的所有客戶資料、標的設定與自訂配色下載為一個備份檔。當您更換電腦、清理瀏覽器快取，或怕不小心把資料改壞時，可以隨時上傳這個檔案還原到先前的 Checkpoint 狀態。</p>
                  </div>
                  <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                    <button onClick={handleExportData} style={{ background: '#3b82f6', color: '#fff', border: 'none', padding: '14px 24px', borderRadius: '12px', cursor: 'pointer', fontWeight: '900', fontSize: '15px', boxShadow: '0 8px 20px rgba(59,130,246,0.3)', display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span style={{ fontSize: '18px' }}>⬇️</span> 建立備份檔 (.json)
                    </button>
                    <button onClick={() => document.getElementById('importFile').click()} style={{ background: '#ffffff', color: '#334155', border: '2px solid #cbd5e1', padding: '14px 24px', borderRadius: '12px', cursor: 'pointer', fontWeight: '900', fontSize: '15px', display: 'flex', alignItems: 'center', gap: '8px', boxShadow: '0 4px 6px rgba(0,0,0,0.02)' }}>
                      <span style={{ fontSize: '18px' }}>⬆️</span> 讀取還原檔
                    </button>
                    <input type="file" id="importFile" accept=".json" style={{ display: 'none' }} onChange={handleImportData} />
                  </div>
                </div>
              </div>

              {/* 標的商品庫區塊 */}
              <div className="glass-card" style={{ padding: '32px' }}>
                <h2 style={{ marginTop: 0, marginBottom: '20px', borderBottom: '2px solid #f1f5f9', paddingBottom: '16px', fontSize: '22px', color: '#0f172a', fontWeight: '900' }}>📦 全域標的商品庫</h2>
                <p style={{ fontSize: '14px', color: '#64748b', marginBottom: '32px', lineHeight: '1.6' }}>在此統一管理投資標的，編輯數據時可快速選取，系統會自動帶入專屬幣別。</p>
                
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: '20px' }}>
                  {products.map((p, idx) => (
                    <div key={p.id} style={{ display: 'flex', gap: '12px', background: '#f8fafc', padding: '20px', borderRadius: '16px', border: '1px solid #e2e8f0', alignItems: 'center', boxShadow: '0 4px 6px rgba(0,0,0,0.02)' }}>
                      <div style={{ display: 'flex', flexDirection: 'column', flex: 1, gap: '12px' }}>
                        <div style={{ display: 'flex', gap: '10px', alignItems: 'center' }}>
                          <span style={{ background: '#e2e8f0', color: '#475569', padding: '4px 8px', borderRadius: '6px', fontSize: '12px', fontWeight: '800' }}>#{idx + 1}</span>
                          <input value={p.name} onChange={e => handleUpdateProduct(p.id, 'name', e.target.value)} placeholder="標的名稱 (如: 鑫穩健-A1)" style={{ ...inputStyle, flex: 1, padding: '8px 12px' }} />
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                          <span style={{ fontSize: '13px', color: '#64748b', fontWeight: 'bold' }}>預設幣別：</span>
                          <select value={p.currency} onChange={e => handleUpdateProduct(p.id, 'currency', e.target.value)} style={{ ...selectStyle, flex: 1, padding: '8px 12px', color: '#0284c7', backgroundPosition: 'right .5rem top 50%' }}>
                            <option value="TWD">🇹🇼 NT$ 新台幣</option>
                            <option value="USD">🇺🇸 US$ 美元</option>
                          </select>
                        </div>
                      </div>
                      <button onClick={() => setDeleteConfirm({ show: true, id: p.id, type: 'product' })} style={{ background: '#fee2e2', color: '#ef4444', border: 'none', width: '40px', height: '40px', borderRadius: '10px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', transition: 'background 0.2s' }}>✕</button>
                    </div>
                  ))}
                  <div onClick={handleAddProduct} style={{ border: '2px dashed #d8b4fe', borderRadius: '16px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', minHeight: '120px', color: '#9333ea', fontWeight: '900', fontSize: '16px', background: '#faf5ff', transition: 'all 0.2s' }}>
                    ➕ 新增商品至庫存
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================== 📝 編輯分頁 ==================================================== */}
          {activeTab === 'data' && (
            <div className="glass-card" style={{ padding: '32px', width: '100%', maxWidth: '1240px', marginTop: '24px' }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', borderBottom: '2px solid #f1f5f9', paddingBottom: '24px', marginBottom: '32px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
                  <h2 style={{ margin: 0, fontSize: '24px', color: '#0f172a', fontWeight: '900' }}>📝 {clientName} 的數據編輯中心</h2>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '12px', background: '#f8fafc', padding: '8px 16px', borderRadius: '12px', border: '1px solid #e2e8f0' }}>
                    <span style={{ fontSize: '14px', color: '#64748b', fontWeight: 'bold' }}>客戶姓名：</span>
                    <input value={clientName} onChange={e => setClientName(e.target.value)} style={{ ...inputStyle, width: '140px', padding: '8px 12px', background: '#ffffff', color: '#2563eb' }} />
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <span style={{ fontSize: '14px', color: '#64748b', whiteSpace: 'nowrap', fontWeight: 'bold' }}>報表大標題：</span>

              </div>
              
              <h3 style={{ marginTop: 0, color: '#0f172a', marginBottom: '20px', fontSize: '18px', fontWeight: '800' }}>💼 帳戶基本資料設定</h3>

                    <div key={acc.id} style={{ flex: '1 1 320px', background: '#ffffff', padding: '24px', borderRadius: '20px', border: `2px solid ${theme.accountColors[acc.id] || '#e2e8f0'}`, boxSizing: 'border-box', position: 'relative', boxShadow: '0 10px 25px rgba(0,0,0,0.03)' }}>

                      </div>

                            const newName = e.target.value; handleAccountChange(acc.id, 'name', newName);
                            const prod = products.find(p => p.name === newName); if (prod) handleAccountChange(acc.id, 'currency', prod.currency);
                          }} 
                          style={{ ...selectStyle, color: '#0f172a' }}
                        >
                          <option value="" disabled>-- 請選擇標的 --</option>
                          {acc.name && !products.find(p => p.name === acc.name) && <option value={acc.name}>{acc.name}</option>}

                            <option key={p.id} value={p.name}>{p.name}</option>

                      </div>

                            <select value={acc.currency || 'TWD'} onChange={e => handleAccountChange(acc.id, 'currency', e.target.value)} style={{ background: '#e2e8f0', color: '#0369a1', border: 'none', padding: '0 10px', outline: 'none', cursor: 'pointer', fontWeight: '800', fontSize: '13px' }}>

                              <option value="USD">US$</option>
                            </select>
                            <input type="number" value={acc.invest} onChange={e => handleAccountChange(acc.id, 'invest', e.target.value)} style={{ flex: 1, background: 'transparent', border: 'none', color: '#0f172a', padding: '10px 12px', width: '100%', outline: 'none', fontWeight: '600' }} placeholder={`金額`} />

                          <input type="number" value={acc.units} onChange={e => handleAccountChange(acc.id, 'units', e.target.value)} style={{ ...inputStyle, flex: '1 1 100px' }} placeholder="單位數" />

                      </div>
                      <div style={{ fontSize: '13px', color: '#10b981', fontWeight: '800', background: '#ecfdf5', padding: '8px 12px', borderRadius: '8px', display: 'inline-block' }}>💡 獨立總投入：{accSym} {(accountTotals.find(a => a.id === acc.id)?.totalInvest || 0).toLocaleString()}</div>
                    </div>
                  );

                <div onClick={handleAddAccount} style={{ flex: '1 1 320px', border: '2px dashed #bae6fd', borderRadius: '20px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', minHeight: '220px', color: '#0284c7', fontWeight: '900', fontSize: '18px', background: '#f0f9ff', transition: 'all 0.2s', boxShadow: '0 4px 15px rgba(2,132,199,0.05)' }}>

              </div>

                  <thead>
                    <tr style={{ background: '#f8fafc' }}>
                      <th style={{ padding: '12px', color: '#475569', fontSize: '13px', width: '100px', borderBottom: '2px solid #e2e8f0' }}>   月份 </th>
                      {accounts.map(acc => (
                        <th key={acc.id} style={{ padding: '16px', color: theme.accountColors[acc.id], fontSize: '14px', borderBottom: '2px solid #e2e8f0' }}>

                            <div>{acc.acc}</div><span>{acc.name || '(未選擇標的)'} </span>
                          </div>
                        </th>
                      ))}

                  </thead>

                        </td>

                          const isUnits = row[`${acc.id}_type`] === '累積單位數';

                            <td key={acc.id} style={{ padding: '12px 16px' }}>
                              <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                  <input 
                                    type="number" 
                                    value={row[acc.id] !== undefined ? row[acc.id] : ''}

                                    style={{ ...inputStyle, padding: '8px 12px', flex: 1 }}

                                    onClick={() => handleTypeChange(index, acc.id, isUnits ? '現金給付' : '累積單位數')}

                                      alignItems: 'center',

                                </div>
                              </td>
                            );
                          })}
                          <td style={{ padding: '12px 16px', color: theme.lineTotal, fontWeight: '900', fontSize: '14px' }}>

                        </tr>
                      ))}
                    </tbody>
                  </table>

              </div>

                      <button onClick={handleRandomizeColors} style={{ background: '#f1f5f9', color: '#334155', border: '1px solid #e2e8f0', padding: '10px 16px', borderRadius: '12px', fontSize: '13px', cursor: 'pointer', whiteSpace: 'nowrap', fontWeight: '800', boxShadow: '0 2px 5px rgba(0,0,0,0.02)' }}>🎲 靈感調色</button>

                          <button onClick={confirmSaveTheme} style={{ background: '#3b82f6', color: '#fff', border: 'none', padding: '10px 16px', cursor: 'pointer', fontWeight: '900' }}>儲存</button>
                        </div>
                      )}
                      <button onClick={handleSaveImage} disabled={isSaving} style={{ background: isSaving ? '#cbd5e1' : 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', color: '#fff', border: 'none', padding: '12px 28px', borderRadius: '14px', fontWeight: '900', boxShadow: isSaving ? 'none' : '0 10px 25px rgba(253, 160, 133, 0.4), inset 0 2px 4px rgba(255,255,255,0.4)', cursor: 'pointer', whiteSpace: 'nowrap', fontSize: '15px', textShadow: '0 1px 2px rgba(0,0,0,0.1)', transition: 'all 0.2s', transform: isSaving ? 'scale(0.98)' : 'scale(1)' }}>📸 產生高清圖片</button>
                      
                      {/* 💡 新增：一鍵打包下載全體客戶報表按鈕 (採用優雅的皇家靛藍漸變色) */}
                      <button 
                        onClick={() => {
                          if (clients.length === 0) {
                            showToast('目前沒有任何客戶資料可供匯出。', 'error');
                            return;
                          }
                          setOriginalClientIdBeforeBatch(activeClientId);
                          setIsSaving(true);
                          setBatchSavedImages([]);
                          setBatchIndex(0); // 觸發批量序列捕捉
                        }} 
                        disabled={isSaving} 
                        style={{ 
                          background: isSaving ? '#cbd5e1' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', 
                          color: '#fff', 
                          border: 'none', 
                          padding: '12px 28px', 
                          borderRadius: '14px', 
                          fontWeight: '900', 
                          boxShadow: isSaving ? 'none' : '0 10px 25px rgba(118, 75, 162, 0.3), inset 0 2px 4px rgba(255,255,255,0.4)', 
                          cursor: 'pointer', 
                          whiteSpace: 'nowrap', 
                          fontSize: '15px', 
                          textShadow: '0 1px 2px rgba(0,0,0,0.1)', 
                          transition: 'all 0.2s', 
                          transform: isSaving ? 'scale(0.98)' : 'scale(1)'

                    </div>
                  </div>

                      <button onClick={() => document.getElementById('bgUploadInput').click()} style={{ background: '#3b82f6', color: '#fff', border: 'none', padding: '6px 14px', borderRadius: '8px', fontSize: '13px', cursor: 'pointer', fontWeight: 'bold', boxShadow: '0 2px 4px rgba(59,130,246,0.1)' }}>

                      </button>
                      <input type="file" id="bgUploadInput" accept="image/*" style={{ display: 'none' }} onChange={handleBgUpload} />
                      
                      {bgImage && (
                        <>
                          <button onClick={() => setBgImage(null)} style={{ background: '#fee2e2', color: '#ef4444', border: 'none', padding: '6px 14px', borderRadius: '8px', fontSize: '13px', cursor: 'pointer', fontWeight: 'bold', marginLeft: '8px' }}>

                          </div>
                        </>

                    <ScaleControl label="指標卡" scaleKey="kpi" />

                    <ScaleControl label="總覽表" scaleKey="table" />
                    <ScaleControl label="紀錄" scaleKey="events" />
                  </div>

                          <span onClick={() => setTheme(t.colors)} style={{ color: '#334155', fontSize: '13px', fontWeight: '800', cursor: 'pointer' }}>🎨 {t.name}</span>

                    </div>

                    width: '100%', 
                    minWidth: '1200px', 
                    margin: '0 auto',
                    background: bgImage ? `url(${bgImage}) no-repeat center center / cover` : 'linear-gradient(180deg, #ffffff 0%, #fcfdfe 100%)', 
                    padding: '48px', 
                    boxSizing: 'border-box',
                    transition: 'background 0.3s ease',
                    borderRadius: '24px'

                    {/* Header 頁首資訊 */}

                        </div>
                        <div style={{ fontSize: 36 * sHeader, fontWeight: 900, color: '#0f172a', whiteSpace: 'nowrap', textShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>

                        </div>
                      </div>
                      <div style={{ textAlign: 'right' }}>

                            <EditableTitle value={clientName} onSave={setClientName} hoverBorder={`1px dashed #1e293b`} />
                          </div>

                    </div>

                          </div>

                maxWidth: '450px',
                textAlign: 'center',
                boxShadow: '0 25px 50px rgba(0,0,0,0.3)',
                color: '#1e293b'
              }}>
                <div style={{ fontSize: '48px', marginBottom: '20px' }}>📦</div>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '20px', fontWeight: '900', color: '#0f172a' }}>
                  正在批量打包全體客戶報表
                </h3>
                <p style={{ color: '#64748b', fontSize: '14px', marginBottom: '24px', fontWeight: '500' }}>
                  正在產生第 <span style={{ color: '#2563eb', fontWeight: '800' }}>{batchIndex + 1}</span> / {clients.length} 位客戶：
                  <br />
                  <span style={{ fontSize: '18px', color: '#0f172a', fontWeight: '900', marginTop: '8px', display: 'inline-block' }}>
                    【{clients[batchIndex]?.clientName || '未命名客戶'}】
                  </span>
                </p>
                
                {/* 進度條外框 */}
                <div style={{ width: '100%', height: '8px', background: '#f1f5f9', borderRadius: '4px', overflow: 'hidden', marginBottom: '12px' }}>
                  <div style={{ 
                    width: `${((batchIndex + 1) / clients.length) * 100}%`, 
                    height: '100%', 
                    background: 'linear-gradient(90deg, #3b82f6, #8b5cf6)', 
                    borderRadius: '4px',
                    transition: 'width 0.3s ease'
                  }}></div>
                </div>
                <span style={{ fontSize: '12px', color: '#94a3b8', fontWeight: 'bold' }}>
                  系統正在自動依序轉譯並打包，請勿關閉本頁面...
                </span>
              </div>
            </div>
          )}

          
          {/* 全域刪除確認視窗 */}
          {deleteConfirm.show && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(15, 23, 42, 0.6)', backdropFilter: 'blur(5px)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#ffffff', padding: '40px', borderRadius: '28px', width: '380px', textAlign: 'center', boxShadow: '0 30px 60px rgba(0,0,0,0.15)' }}>
                <div style={{ fontSize: '48px', marginBottom: '16px', filter: 'drop-shadow(0 4px 6px rgba(0,0,0,0.1))' }}>⚠️</div>
                <h3 style={{ color: '#0f172a', marginTop: 0, fontSize: '24px', fontWeight: '900' }}>確認刪除？</h3>
                <p style={{ color: '#64748b', fontSize: '15px', fontWeight: 'bold' }}>刪除後將無法復原，您確定嗎？</p>
                <div style={{ display: 'flex', gap: '12px', marginTop: '32px' }}>
                  <button onClick={() => setDeleteConfirm({ show: false, id: null, type: '' })} style={{ flex: 1, background: '#f1f5f9', color: '#475569', border: 'none', padding: '14px', borderRadius: '12px', cursor: 'pointer', fontWeight: '800', fontSize: '15px' }}>取消</button>
                  <button onClick={confirmDeleteAction} style={{ flex: 1, background: '#ef4444', color: '#fff', border: 'none', padding: '14px', borderRadius: '12px', cursor: 'pointer', fontWeight: '900', fontSize: '15px', boxShadow: '0 8px 20px rgba(239, 68, 68, 0.3)' }}>確認刪除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
