            <div style={{ position: 'fixed', inset: 0, background: 'rgba(15, 23, 42, 0.85)', backdropFilter: 'blur(8px)', zIndex: 9999, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px' }}>
              <div style={{ width: '100%', maxWidth: '1000px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                <div style={{ background: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)', color: '#ffffff', padding: '12px 24px', borderRadius: '16px', fontWeight: '900', fontSize: '18px', boxShadow: '0 10px 25px rgba(253, 160, 133, 0.4)' }}>✨ 報表已生成！請按滑鼠右鍵或長按圖片儲存</div>
                <button onClick={() => setSavedImage(null)} style={{ background: '#ffffff', color: '#0f172a', border: 'none', width: '48px', height: '48px', borderRadius: '50%', cursor: 'pointer', fontSize: '20px', fontWeight: 'bold', boxShadow: '0 4px 15px rgba(0,0,0,0.1)' }}>✕</button>
              </div>
              <img src={savedImage} alt="投資報表" style={{ maxWidth: '100%', maxHeight: '80vh', borderRadius: '24px', boxShadow: '0 25px 50px rgba(0,0,0,0.25)' }} />
            </div>
          )}

          {/* 高質感全域 Toast 提示框 */}
          {toast.show && (
            <div style={{
              position: 'fixed',
              top: '24px',
              left: '50%',
              transform: 'translateX(-50%)',
              background: toast.type === 'success' ? 'rgba(16, 185, 129, 0.95)' : 'rgba(239, 68, 68, 0.95)',
              color: '#ffffff',
              padding: '12px 24px',
              borderRadius: '14px',
              boxShadow: '0 10px 30px rgba(0,0,0,0.15)',
              zIndex: 10001,
              fontWeight: 'bold',
              backdropFilter: 'blur(8px)',
              border: '1px solid rgba(255,255,255,0.2)',
              transition: 'all 0.3s ease',
              animation: 'slideDown 0.3s ease-out'
            }}>
              {toast.message}
            </div>
          )}

          {/* 💡 ⚡ 智慧快速/批次建立客戶多保單彈窗 */}
          {showQuickCreateModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(15, 23, 42, 0.6)', backdropFilter: 'blur(5px)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px' }}>
              <div className="glass-card" style={{ width: '100%', maxWidth: '1150px', maxHeight: '90vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', border: 'none' }}>
                
                {/* 彈窗頁首 */}
                <div style={{ background: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)', padding: '24px', color: '#ffffff' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <h3 style={{ margin: 0, fontSize: '20px', fontWeight: '900', display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span>⚡</span> 智慧批次建檔助理 (大量客戶匯入)
                    </h3>
                    <button onClick={() => setShowQuickCreateModal(false)} style={{ background: 'rgba(255,255,255,0.1)', color: '#fff', border: 'none', width: '32px', height: '32px', borderRadius: '50%', cursor: 'pointer', fontSize: '16px', fontWeight: 'bold' }}>✕</button>
                  </div>
                </div>

                {/* 彈窗內容區 */}
                <div style={{ padding: '24px', overflowY: 'auto', flex: 1, display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <label style={labelStyle}>📋 請貼入批次格式文字：</label>
                    
                    {/* 格式說明與範例區，永遠保持顯示 */}
                    <div style={{ background: '#f1f5f9', border: '1px solid #cbd5e1', padding: '14px 18px', borderRadius: '12px', fontSize: '12px', color: '#475569', lineHeight: '1.5' }}>
                      <div style={{ fontWeight: '900', color: '#0f172a', marginBottom: '6px', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '6px' }}>
                        <span>📌</span> 批次匯入格式說明與範例：
                      </div>
                      <div style={{ marginBottom: '8px' }}>
                        每一行代表一筆保單。同一個人的多個保單請使用「<b>相同的客戶姓名</b>」，系統會自動進行多保單合併！
                      </div>
                      <div style={{ fontWeight: 'bold', color: '#0f172a', marginBottom: '4px' }}>📐 欄位順序（以半形 <code>,</code> 或全形 <code>，</code> 隔開，後續配息三項組選填，最多支援 6 組，金額可寫中文「萬」）：</div>
                      <div style={{ background: '#e2e8f0', color: '#0f172a', padding: '6px 12px', borderRadius: '8px', fontFamily: 'monospace', fontSize: '11px', fontWeight: 'bold', display: 'inline-block', marginBottom: '8px' }}>
                        保單號碼 , 客戶姓名 , 投保日期 , 基金標的 , [配息月份1] , [配息金額1] , [給付方式1] , [配息月份2] , [配息金額2] , [給付方式2] ...
                      </div>
                      <div style={{ fontWeight: 'bold', color: '#0f172a', marginBottom: '4px' }}>📝 大量貼上對帳單範例（包含多月份歷史配息登錄）：</div>
                      <pre style={{ background: '#ffffff', border: '1px solid #cbd5e1', padding: '10px 14px', borderRadius: '8px', margin: 0, fontFamily: 'monospace', fontSize: '11px', color: '#1e293b', overflowX: 'auto', lineHeight: '1.6' }}>
{`112001 , 王小明 , 115/01/01 , 鑫穩健-A1 , 4月 , 2200 , 累積單位數 , 5月 , 2229 , 累積單位數
112002 , 王小明 , 115/02/01 , 環球總報酬 , 5月 , 1500 , 現金給付
223001 , 李大同 , 115/03/15 , e指標-A1 , 5月 , 4200 , 現金給付 , 6月 , 4500 , 現金給付`}
                      </pre>
                    </div>

                    <textarea 
                      value={batchImportText}
                      onChange={e => setBatchImportText(e.target.value)}
                      placeholder="請對照上方格式，在此貼上或輸入批次客戶保單與多月份配息數據..."
                      style={{ ...inputStyle, height: '180px', resize: 'vertical', fontFamily: 'monospace', fontSize: '13px', background: '#f8fafc', lineHeight: '1.6' }}
                    />
                    <span style={{ fontSize: '12px', color: '#64748b', lineHeight: '1.4' }}>
                      💡 <b>系統特異功能：</b> 智慧對齊比對器會自動根據您的「客戶姓名」將連續多張保單完美彙整在同一人名下！「基金標的」即使只寫關鍵字如「環球」，系統會自動模糊配對全名。
                    </span>
                  </div>

                </div>

                {/* 彈窗頁尾 */}
                <div style={{ padding: '16px 24px', background: '#f1f5f9', borderTop: '1px solid #cbd5e1', display: 'flex', gap: '12px', justifyContent: 'flex-end' }}>
                  <button 
                    onClick={() => { setShowQuickCreateModal(false); setBatchImportText(''); }}
                    style={{ background: '#fff', color: '#475569', border: '1px solid #cbd5e1', padding: '10px 20px', borderRadius: '10px', cursor: 'pointer', fontWeight: 'bold', fontSize: '14px' }}
                  >
                    取消
                  </button>
                  <button 
                    onClick={handleQuickCreateSubmit}
                    style={{ background: 'linear-gradient(135deg, #16a34a 0%, #15803d 100%)', color: '#fff', border: 'none', padding: '10px 24px', borderRadius: '10px', cursor: 'pointer', fontWeight: 'bold', fontSize: '14px', boxShadow: '0 4px 12px rgba(22,163,74,0.15)' }}
                  >
                    🚀 確認無誤，智慧建檔
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* 💡 批量打包下載全體客戶進度條 Overlay */}
          {batchIndex !== -1 && (
            <div style={{
              position: 'fixed',
              inset: 0,
              background: 'rgba(15, 23, 42, 0.85)',
              backdropFilter: 'blur(8px)',
              zIndex: 10002,
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              padding: '20px',
              color: '#ffffff'
            }}>
              <div style={{
                background: '#ffffff',
                padding: '40px',
                borderRadius: '24px',
                width: '100%',
                maxWidth: '450px',
                textAlign: 'center',
                boxShadow: '0 25px 50px rgba(0,0,0,0.3)',
                color: '#1e293b'
              }}>
                <div style={{ fontSize: '48px', marginBottom: '20px' }}>📦</div>
                <h3 style={{ margin: '0 0 10px 0', fontSize: '20px', fontWeight: '900', color: '#0f172a' }}>
                  正在批量打包全體客戶報表
                </h3>
                <p style={{ color: '#64748b', fontSize: '14px', marginBottom: '24px', fontWeight: '500' }}>
                  正在產生第 <span style={{ color: '#2563eb', fontWeight: '800' }}>{batchIndex + 1}</span> / {clients.length} 位客戶：
                  <br />
                  <span style={{ fontSize: '18px', color: '#0f172a', fontWeight: '900', marginTop: '8px', display: 'inline-block' }}>
                    【{clients[batchIndex]?.clientName || '未命名客戶'}】
                  </span>
                </p>
                
                <div style={{ width: '100%', height: '8px', background: '#f1f5f9', borderRadius: '4px', overflow: 'hidden', marginBottom: '12px' }}>
                  <div style={{ 
                    width: `${((batchIndex + 1) / clients.length) * 100}%`, 
                    height: '100%', 
                    background: 'linear-gradient(90deg, #3b82f6, #8b5cf6)', 
                    borderRadius: '4px',
                    transition: 'width 0.3s ease'
                  }}></div>
                </div>
                <span style={{ fontSize: '12px', color: '#94a3b8', fontWeight: 'bold' }}>
                  系統正在自動依序轉譯並打包，請勿關閉本頁面...
                </span>
              </div>
            </div>
          )}

          {/* 全域刪除確認視窗 */}
          {deleteConfirm.show && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(15, 23, 42, 0.6)', backdropFilter: 'blur(5px)', zIndex: 10000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ background: '#ffffff', padding: '40px', borderRadius: '28px', width: '380px', textAlign: 'center', boxShadow: '0 30px 60px rgba(0,0,0,0.15)' }}>
                <div style={{ fontSize: '48px', marginBottom: '16px', filter: 'drop-shadow(0 4px 6px rgba(0,0,0,0.1))' }}>⚠️</div>
                <h3 style={{ color: '#0f172a', marginTop: 0, fontSize: '24px', fontWeight: '900' }}>確認刪除？</h3>
                <p style={{ color: '#64748b', fontSize: '15px', fontWeight: 'bold' }}>刪除後將無法復原，您確定嗎？</p>
                <div style={{ display: 'flex', gap: '12px', marginTop: '32px' }}>
                  <button onClick={() => setDeleteConfirm({ show: false, id: null, type: '' })} style={{ flex: 1, background: '#f1f5f9', color: '#475569', border: 'none', padding: '14px', borderRadius: '12px', cursor: 'pointer', fontWeight: '800', fontSize: '15px' }}>取消</button>
                  <button onClick={confirmDeleteAction} style={{ flex: 1, background: '#ef4444', color: '#fff', border: 'none', padding: '14px', borderRadius: '12px', cursor: 'pointer', fontWeight: '900', fontSize: '15px', boxShadow: '0 8px 20px rgba(239, 68, 68, 0.3)' }}>確認刪除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
